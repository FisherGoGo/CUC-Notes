    <text x="120" y="730" class="label">感知 - 推理 - 决策 - 行动</text>
    <circle cx="130" cy="770" r="10" fill="#2563eb"/><text x="152" y="776" class="small">视觉：位置、姿态、视线、表情</text>
    <circle cx="130" cy="810" r="10" fill="#0f766e"/><text x="152" y="816" class="small">听觉：声源定位、发言追踪</text>
    <circle cx="130" cy="850" r="10" fill="#f59e0b"/><text x="152" y="856" class="small">推理：专注度、困惑度、参与度</text>
    <circle cx="130" cy="890" r="10" fill="#7c3aed"/><text x="152" y="896" class="small">行动：AR 提示、热力图、课后报告</text>
  </g>

