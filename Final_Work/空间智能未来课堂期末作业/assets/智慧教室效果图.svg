<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfe7ef"/>
      <stop offset="100%" stop-color="#cfd9e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#607080" flood-opacity="0.22"/>
    </filter>
    <style>
      .title { font: 700 44px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #162033; }
      .subtitle { font: 400 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #526174; }
      .label { font: 600 20px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1c2738; }
      .small { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #526174; }
      .tiny { font: 500 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #ffffff; }
      .line { stroke: #7b8da3; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 10; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#room)"/>
  <text x="90" y="80" class="title">空间智能驱动的自适应未来课堂系统</text>
  <text x="92" y="120" class="subtitle">视觉 + 听觉融合感知 · 课堂状态推理 · 教师决策辅助 · 低打扰反馈行动</text>

  <polygon points="160,240 1110,150 1430,790 330,900" fill="url(#floor)" stroke="#b8c6d6" stroke-width="4"/>
  <polygon points="160,240 1110,150 1110,250 190,330" fill="#edf3f8" stroke="#c9d4df" stroke-width="3"/>
  <polygon points="1110,150 1430,790 1430,650 1110,250" fill="#e2eaf2" stroke="#c9d4df" stroke-width="3"/>

  <rect x="425" y="205" width="520" height="95" rx="8" fill="#26364f" filter="url(#shadow)"/>
  <rect x="445" y="222" width="480" height="60" rx="4" fill="#111827"/>
  <polyline points="475,260 560,248 640,265 720,235 815,252 900,238" fill="none" stroke="#47d18c" stroke-width="5"/>
  <text x="475" y="195" class="label">课堂大屏：整体专注度与互动曲线</text>

  <g filter="url(#shadow)">
    <circle cx="740" cy="370" r="36" fill="#2563eb"/>
    <rect x="705" y="405" width="70" height="115" rx="28" fill="#2f4b7c"/>
    <rect x="677" y="430" width="42" height="16" rx="8" fill="#5b78a6"/>
