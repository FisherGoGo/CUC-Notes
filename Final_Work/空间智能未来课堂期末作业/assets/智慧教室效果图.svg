      <ellipse cx="0" cy="55" rx="62" ry="30" fill="#b7c2cf"/>
      <circle cx="0" cy="0" r="26" fill="#4b5563"/>
      <rect x="-32" y="23" width="64" height="60" rx="22" fill="#66758a"/>
      <circle cx="38" cy="-28" r="16" fill="#f59e0b"/>
      <text x="32" y="-23" class="tiny">波动</text>
    </g>
    <g transform="translate(1120 720)">
      <ellipse cx="0" cy="55" rx="62" ry="30" fill="#b7c2cf"/>
      <circle cx="0" cy="0" r="26" fill="#4b5563"/>
      <rect x="-32" y="23" width="64" height="60" rx="22" fill="#66758a"/>
      <circle cx="38" cy="-28" r="16" fill="#22c55e"/>
