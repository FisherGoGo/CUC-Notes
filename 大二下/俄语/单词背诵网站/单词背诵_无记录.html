<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>俄语单词背诵</title>
  <style>
    :root {
      --bg: #f7f9fb;
      --paper: #ffffff;
      --ink: #17202a;
      --muted: #687486;
      --line: #dfe5ec;
      --soft: #eef3f8;
      --red: #b32632;
      --red-dark: #8d1d28;
      --blue: #d8edf8;
      --blue-ink: #1c5f78;
      --amber: #f0b44b;
      --green: #207a55;
      --shadow: 0 18px 50px rgba(25, 39, 57, .10);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(140deg, rgba(216, 237, 248, .9), rgba(247, 249, 251, 0) 34%),
        linear-gradient(320deg, rgba(240, 180, 75, .16), rgba(247, 249, 251, 0) 40%),
        var(--bg);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      letter-spacing: 0;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      color: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr) 320px;
      gap: 20px;
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px;
    }

    .rail, .side {
      align-self: stretch;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 8px 28px rgba(25, 39, 57, .06);
    }

    .rail {
      display: flex;
      flex-direction: column;
      padding: 18px;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--red);
      color: #fff;
      font-weight: 800;
      font-size: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .search svg {
      flex: none;
      color: var(--muted);
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 14px;
    }

    .nav {
      display: grid;
      gap: 7px;
    }

    .nav button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 38px;
      padding: 0 10px;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      font-size: 14px;
    }

    .nav button:hover { background: var(--soft); color: var(--ink); }
    .nav button.active { background: var(--red); color: #fff; }

    .nav span:last-child {
      font-size: 12px;
      opacity: .8;
    }

    .mini-art {
      margin-top: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fdfefe;
    }

    .mini-art svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .stage {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .86);
    }

    .mode-tabs button {
      min-width: 92px;
      height: 34px;
      padding: 0 14px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .mode-tabs button.active {
      background: var(--ink);
      color: #fff;
    }

    .tool-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .icon-btn, .text-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      box-shadow: 0 6px 18px rgba(25, 39, 57, .05);
      font-size: 14px;
      font-weight: 650;
    }

    .icon-btn {
      width: 42px;
      padding: 0;
    }

    .text-btn.primary {
      border-color: var(--red);
      background: var(--red);
      color: #fff;
    }

    .text-btn.primary:hover { background: var(--red-dark); }

    .flash-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 18px;
      min-height: 520px;
    }

    .flash-card {
      position: relative;
      display: grid;
      align-content: center;
      min-height: 520px;
      padding: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .flash-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 7px;
      background: linear-gradient(90deg, var(--red), var(--amber), var(--blue));
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .ru-word {
      margin: 28px 0 10px;
      font-family: "Times New Roman", Cambria, serif;
      font-size: var(--word-size, clamp(58px, 8vw, 112px));
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: clip;
    }

    .meaning {
      margin: 0;
      font-size: 30px;
      line-height: 1.25;
      font-weight: 800;
    }

    .details {
      display: grid;
      gap: 8px;
      margin-top: 26px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.55;
    }

    .details strong {
      color: var(--ink);
      font-weight: 750;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      flex-wrap: wrap;
    }

    .answer-btn {
      min-width: 122px;
      height: 44px;
      border-radius: var(--radius);
      color: #fff;
      font-weight: 760;
    }

    .answer-btn.good { background: var(--green); }
    .answer-btn.bad { background: var(--red); }
    .answer-btn.neutral {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .answer-btn.is-hidden {
      display: none;
    }

    .queue {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .queue-title {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .queue-safe {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .88);
    }

    .queue-safe b {
      display: block;
      font-size: 30px;
      line-height: 1;
    }

    .queue-safe span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .word-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .85);
    }

    .word-row button {
      background: transparent;
      text-align: left;
      padding: 0;
    }

    .word-row b {
      display: block;
      font-family: "Times New Roman", Cambria, serif;
      font-size: 18px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .word-row small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .score-dot {
      align-self: start;
      min-width: 26px;
      height: 22px;
      padding: 0 6px;
      border-radius: 6px;
      background: var(--soft);
      color: var(--blue-ink);
      font-size: 12px;
      line-height: 22px;
      text-align: center;
      font-weight: 800;
    }

    .quiz {
      display: none;
      min-height: 520px;
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .quiz.active { display: grid; align-content: start; gap: 24px; }

    .quiz-question {
      display: grid;
      gap: 14px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .quiz-question small {
      color: var(--muted);
      font-weight: 750;
    }

    .quiz-question strong {
      font-family: "Times New Roman", Cambria, serif;
      font-size: clamp(44px, 6vw, 78px);
      line-height: 1;
      white-space: nowrap;
    }

    .quiz-answer {
      gap: 12px;
      display: grid;
    }

    .quiz-input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .quiz-input {
      min-width: min(360px, 100%);
      min-height: 48px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      outline: 0;
      background: #fff;
      font-family: "Times New Roman", Cambria, serif;
      font-size: 25px;
      font-weight: 750;
    }

    .quiz-input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(179, 38, 50, .10);
    }

    .quiz-feedback {
      min-height: 24px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 750;
    }

    .quiz-feedback.correct { color: var(--green); }
    .quiz-feedback.wrong { color: var(--red); }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(11, minmax(34px, 1fr));
      gap: 6px;
      max-width: 620px;
    }

    .key {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      font-family: "Times New Roman", Cambria, serif;
      font-size: 20px;
      font-weight: 800;
    }

    .key:hover {
      border-color: var(--red);
      color: var(--red);
    }

    .cloze-prompt {
      display: grid;
      gap: 8px;
    }

    .cloze-word {
      font-family: "Times New Roman", Cambria, serif;
      font-size: clamp(42px, 6vw, 72px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
      word-break: break-word;
    }

    .cloze-meaning {
      font-size: 24px;
      line-height: 1.25;
      font-weight: 800;
    }

    .list-view {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }

    .list-view.active { display: grid; }

    .vocab-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .vocab-card h3 {
      margin: 0;
      font-family: "Times New Roman", Cambria, serif;
      font-size: 27px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .vocab-card p {
      margin: 8px 0 0;
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }

    .vocab-card small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      line-height: 1.45;
    }

    .side {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .stat b {
      display: block;
      font-size: 30px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .progress {
      height: 10px;
      border-radius: 99px;
      background: var(--soft);
      overflow: hidden;
    }

    .progress div {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--red), var(--amber));
      transition: width .25s ease;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0;
      font-size: 15px;
    }

    .review-list {
      display: grid;
      gap: 8px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      padding: 12px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.7);
    }

    .hidden-answer .meaning, .hidden-answer .details {
      visibility: hidden;
    }

    .reverse-card.hidden-answer .ru-word, .reverse-card.hidden-answer .details {
      visibility: hidden;
    }

    .reverse-card.hidden-answer .meaning {
      visibility: visible;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      transition: all .18s ease;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 210px minmax(0, 1fr); }
      .side { grid-column: 1 / -1; }
      .flash-area { grid-template-columns: minmax(0, 1fr); }
      .queue { display: none; }
    }

    @media (max-width: 760px) {
      .app {
        display: flex;
        flex-direction: column;
        padding: 14px;
        overflow-x: hidden;
      }

      .stage, .rail, .side, .flash-area, .quiz, .list-view {
        width: 100%;
        max-width: 100%;
      }

      .rail {
        min-height: auto;
        padding: 14px;
        gap: 10px;
      }

      .nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .nav button {
        flex: 0 0 auto;
        min-width: 112px;
      }

      .mini-art { display: none; }

      .topbar {
        align-items: stretch;
        flex-direction: column;
      }

      .mode-tabs { overflow-x: auto; }
      .mode-tabs button { min-width: 86px; }

      .flash-card {
        width: calc(100vw - 28px);
        max-width: calc(100vw - 28px);
        min-height: 360px;
        padding: 30px 22px;
      }

      .ru-word {
        margin-top: 22px;
        font-size: 58px;
      }
      .meaning { font-size: 25px; }
      .details { font-size: 16px; }
      .card-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-top: 24px;
      }
      .answer-btn {
        width: 316px;
        max-width: 100%;
        justify-self: start;
        min-width: 0;
        padding: 0 8px;
        font-size: 15px;
      }
      .keyboard { grid-template-columns: repeat(7, minmax(34px, 1fr)); }
      .quiz-input-row { display: grid; }
      .quiz-input { min-width: 0; width: 100%; }
      .quiz { padding: 24px 18px; }
      .tool-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="rail">
      <div class="brand">
        <div class="brand-mark">Я</div>
        <div>
          <h1>俄语单词背诵</h1>
          <p>闪卡 · 测验 · 错题复习</p>
        </div>
      </div>

      <label class="search" aria-label="搜索单词">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="m21 21-4.3-4.3m1.3-5.2a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜中文、俄文、发音" />
      </label>

      <nav class="nav" id="categoryNav" aria-label="单词分类"></nav>

      <div class="mini-art" aria-hidden="true">
        <svg viewBox="0 0 236 150" role="img">
          <rect width="236" height="150" fill="#f9fbfd"/>
          <path d="M28 31h88c12 0 22 10 22 22v67H48c-11 0-20-9-20-20V31Z" fill="#fff" stroke="#dfe5ec"/>
          <path d="M138 53c0-12 10-22 22-22h48v89h-70V53Z" fill="#f2f7fb" stroke="#dfe5ec"/>
          <path d="M48 58h55M48 78h70M48 98h58" stroke="#c5d0dc" stroke-width="3" stroke-linecap="round"/>
          <text x="51" y="47" font-size="17" font-family="Georgia" fill="#b32632">мама</text>
          <text x="150" y="68" font-size="15" font-family="Georgia" fill="#1c5f78">метро</text>
          <path d="M154 86h46v24h-46z" fill="#fff" stroke="#dfe5ec"/>
          <path d="M161 96h32M161 103h20" stroke="#f0b44b" stroke-width="3" stroke-linecap="round"/>
          <circle cx="205" cy="39" r="13" fill="#f0b44b"/>
        </svg>
      </div>
    </aside>

    <section class="stage">
      <div class="topbar">
        <div class="mode-tabs" role="tablist" aria-label="学习模式">
          <button class="active" data-mode="flash">闪卡</button>
          <button data-mode="reverse">中译俄</button>
          <button data-mode="quiz">测验</button>
          <button data-mode="list">词表</button>
        </div>
        <div class="tool-actions">
          <button class="icon-btn" id="speakBtn" title="朗读俄语" aria-label="朗读俄语">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="shuffleBtn" title="随机抽词" aria-label="随机抽词">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="text-btn" id="reviewWrongBtn">错题复习</button>
          <button class="text-btn primary" id="resetBtn">重置进度</button>
        </div>
      </div>

      <div id="flashPane" class="flash-area">
        <article class="flash-card hidden-answer" id="flashCard">
          <div class="card-meta">
            <span id="cardCount">随机队列 1 / 1</span>
          </div>
          <div class="ru-word" id="ruWord">слово</div>
          <p class="meaning" id="meaning">中文</p>
          <div class="details">
            <div><strong>音标</strong> <span id="ipa"></span></div>
            <div><strong>读法</strong> <span id="roman"></span></div>
          </div>
          <div class="card-actions">
            <button class="answer-btn neutral" id="flipBtn">显示答案</button>
            <button class="answer-btn bad is-hidden" id="badBtn">忘记了</button>
            <button class="answer-btn good is-hidden" id="goodBtn">背对了</button>
          </div>
        </article>

        <aside class="queue">
          <p class="queue-title">背诵状态</p>
          <div class="queue-safe">
            <b id="queueRemaining">0</b>
            <span id="queueHint">不会显示后面的单词，避免提前看到答案。</span>
          </div>
        </aside>
      </div>

      <section id="quizPane" class="quiz" aria-live="polite">
        <div class="quiz-question">
          <small id="quizType">补全被挖掉的俄语字母</small>
          <div class="cloze-prompt" id="clozePrompt">
            <div class="cloze-word" id="clozeWord">б_нк</div>
            <div class="cloze-meaning" id="clozeMeaning">银行</div>
          </div>
        </div>
        <div class="quiz-answer" id="typedAnswer">
          <div class="quiz-input-row">
            <input class="quiz-input" id="quizInput" type="text" autocomplete="off" spellcheck="false" aria-label="输入俄语答案" />
            <button class="text-btn primary" id="submitQuizBtn">提交</button>
          </div>
          <div class="keyboard" id="ruKeyboard" aria-label="俄语键盘"></div>
        </div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <button class="text-btn primary" id="nextQuizBtn">下一题</button>
      </section>

      <section id="listPane" class="list-view"></section>

      { zh: "花瓶", ru: "ва́за", ipa: "[ˈvazə]", roman: "(VA-za)", category: "物品" },

      { zh: "苹果", ru: "я́блоко", ipa: "[ˈjabləkə]", roman: "(YA-bla-ka)", category: "物品" },

      { zh: "白天", ru: "день", ipa: "[dʲenʲ]", roman: "(dyen')", category: "时间与概念" },

      { zh: "语言", ru: "язы́к", ipa: "[ɪˈzɨk]", roman: "(ya-ZYK)", category: "时间与概念" },
      { zh: "人", ru: "челове́к", ipa: "[t͡ɕɪlɐˈvʲek]", roman: "(che-la-VYEK)", category: "时间与概念" },
      { zh: "时间", ru: "вре́мя", ipa: "[ˈvrʲemʲə]", roman: "(VRYE-mya)", category: "时间与概念" },

      { zh: "知道", ru: "знать", ipa: "[znatʲ]", roman: "(znat')", category: "动词" },
      { zh: "上班", ru: "рабо́та", ipa: "[rɐˈbotə]", roman: "(ra-BO-ta)", category: "动词" },
      { zh: "休息", ru: "отдыха́ть", ipa: "[ɐdːɨˈxatʲ]", roman: "(ad-dy-haT')", category: "动词" },
      { zh: "听", ru: "слу́шать", ipa: "[ˈsɫuʂətʲ]", roman: "(SLU-shat')", category: "动词" },
      { zh: "说", ru: "говори́ть", ipa: "[ɡəvɐˈrʲitʲ]", roman: "(ga-va-RIT')", category: "动词" },
      { zh: "做", ru: "де́лать", ipa: "[ˈdʲeɫətʲ]", roman: "(DYE-lat')", category: "动词" },
      { zh: "看", ru: "смотре́ть", ipa: "[smɐˈtrʲetʲ]", roman: "(sma-TRYET')", category: "动词" },

      { zh: "新的", ru: "но́вый", ipa: "[ˈnovɨj]", roman: "(NO-viy)", category: "形容词" },
      { zh: "旧的、老的", ru: "ста́рый", ipa: "[ˈstarɨj]", roman: "(STA-riy)", category: "形容词" },
      { zh: "好的", ru: "хоро́ший", ipa: "[xərɐˈʂɨj]", roman: "(ha-ra-SHIY)", category: "形容词" },
      { zh: "大的", ru: "большо́й", ipa: "[bɐlʲˈʂoj]", roman: "(bal-SHOY)", category: "形容词" },
      { zh: "俄罗斯的", ru: "ру́сский", ipa: "[ˈruskʲɪj]", roman: "(RUS-kiy)", category: "形容词" },
      { zh: "贵的、亲爱的", ru: "дорого́й", ipa: "[dərɐˈɡoj]", roman: "(da-ra-GOY)", category: "形容词" },
      { zh: "便宜的", ru: "дешёвый", ipa: "[dʲɪˈʂovɨj]", roman: "(dye-SHO-viy)", category: "形容词" },

      { zh: "厨师", ru: "повари́ха", ipa: "[pəvərʲɪˈxə]", roman: "(pa-va-RI-ha)", category: "职业" },
      { zh: "工程师", ru: "инжене́р", ipa: "[ɪnʐɨˈnʲer]", roman: "(in-zhe-NYER)", category: "职业" },
      { zh: "诗人", ru: "поэ́т", ipa: "[pɐˈet]", roman: "(pa-ET)", category: "职业" },
      { zh: "记者", ru: "журнали́ст", ipa: "[ʐʊrnɐˈlʲist]", roman: "(zhur-na-LIST)", category: "职业" },
      { zh: "司机", ru: "води́тель", ipa: "[vɐˈdʲitʲɪlʲ]", roman: "(va-DI-tyel')", category: "职业" }
    ];

    const state = {
      category: "全部",
      mode: "flash",
      index: 0,
      revealed: false,
      quizWord: null,
      quizLocked: false,
      quizAnswer: "",
      cloze: null,
      round: { seen: 0, bad: 0, lastRate: null },
      progress: JSON.parse(localStorage.getItem("ru-vocab-progress-clean") || "{}"),
      search: "",
      deck: [],
      deckKey: ""
    };

    const $ = (id) => document.getElementById(id);
    const categories = ["全部", ...Array.from(new Set(words.map((word) => word.category))), "错题"];
    const russianLetters = "абвгдеёжзийклмнопрстуфхцчшщъыьэюя".split("");

    function idFor(word) {
      return `${word.ru}|${word.zh}`;
    }

    function saveProgress() {
      localStorage.setItem("ru-vocab-progress-clean", JSON.stringify(state.progress));
    }

    function progressFor(word) {
      return state.progress[idFor(word)] || { seen: 0, good: 0, bad: 0 };
    }

    function badCount(word) {
      return progressFor(word).bad || 0;
    }

    function sortByBadCount(list) {
      return [...list].sort((a, b) =>
        badCount(b) - badCount(a) || (progressFor(b).seen || 0) - (progressFor(a).seen || 0) || a.zh.localeCompare(b.zh, "zh-CN")
      );
    }

    function currentRoundRate() {
      if (state.round.seen > 0) return Math.round(state.round.bad / state.round.seen * 100);
      return state.round.lastRate ?? 0;
    }

    function normalizeRussian(text) {
      return text
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, "")
        .toLowerCase();
    }

    function record(word, correct) {
      const id = idFor(word);
      const item = state.progress[id] || { seen: 0, good: 0, bad: 0 };
      item.seen += 1;
      if (correct) item.good += 1;
      else item.bad += 1;
      state.round.seen += 1;
      if (!correct) state.round.bad += 1;
      state.progress[id] = item;
      saveProgress();
      render();
    }

    function getFiltered() {
      const q = state.search.trim().toLowerCase();
      return words.filter((word) => {
        const p = state.progress[idFor(word)] || { bad: 0, good: 0 };
        const categoryMatch =
          state.category === "全部" ||
          word.category === state.category ||
          (state.category === "错题" && p.bad > p.good);
        const searchMatch = !q || [word.zh, word.ru, word.ipa, word.roman, word.category]
          .join(" ")
          .toLowerCase()
          .includes(q);
        return categoryMatch && searchMatch;
      });
    }

    function shuffleList(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function deckKeyFor(list) {
      return `${state.category}|${state.search}|${list.map(idFor).join("||")}`;
    }

    function getDeck() {
      const list = getFiltered();
      const key = deckKeyFor(list);
      if (key !== state.deckKey) {
        state.deck = shuffleList(list);
        state.deckKey = key;
        state.index = 0;
      }
      return state.deck;
    }

    function reshuffleDeck(keepCurrent = false) {
      const current = keepCurrent ? currentWord() : null;
      const list = getFiltered();
      const rest = current
        ? list.filter((word) => idFor(word) !== idFor(current))
        : list;
      state.deck = current ? [current, ...shuffleList(rest)] : shuffleList(rest);
      state.deckKey = deckKeyFor(list);
      state.index = 0;
    }

    function currentWord() {
      const deck = getDeck();
      if (!deck.length) return null;
      state.index = Math.max(0, Math.min(state.index, deck.length - 1));
      return deck[state.index];
    }

    function nextWord() {
      const deck = getDeck();
      if (!deck.length) return;
      state.index += 1;
      if (state.index >= deck.length) {
        state.round.lastRate = currentRoundRate();
        toast(`这一轮结束，错误率 ${state.round.lastRate}%`);
        state.round = { seen: 0, bad: 0, lastRate: state.round.lastRate };
        state.deck = shuffleList(deck);
        state.index = 0;
      }
      state.revealed = false;
      render();
    }

    function toast(text) {
      const el = $("toast");
      el.textContent = text;
      el.classList.add("show");
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => el.classList.remove("show"), 1500);
    }

    function speak(word) {
      if (!word || !("speechSynthesis" in window)) {
        toast("当前浏览器不支持朗读");
        return;
      }
      const utterance = new SpeechSynthesisUtterance(word.ru.replace(/[́]/g, ""));
      utterance.lang = "ru-RU";
      utterance.rate = .82;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function renderNav() {
      $("categoryNav").innerHTML = categories.map((cat) => {
        const count = cat === "全部"
          ? words.length
          : cat === "错题"
            ? words.filter((word) => {
                const p = state.progress[idFor(word)] || {};
                return (p.bad || 0) > (p.good || 0);
              }).length
            : words.filter((word) => word.category === cat).length;
        return `<button class="${state.category === cat ? "active" : ""}" data-category="${cat}">
          <span>${cat}</span><span>${count}</span>
        </button>`;
      }).join("");
    }

    function renderFlash() {
      const list = getFiltered();
      const word = currentWord();
      const isReverse = state.mode === "reverse";
      $("flashCard").classList.toggle("hidden-answer", !state.revealed);
      $("flashCard").classList.toggle("reverse-card", isReverse);
      if (!word) {
        $("ruWord").style.removeProperty("--word-size");
        $("ruWord").textContent = "没有词条";
        $("meaning").textContent = "换个分类或搜索词";
        $("ipa").textContent = "";
        $("roman").textContent = "";
        $("cardCount").textContent = "随机队列 0 / 0";
        $("queueRemaining").textContent = "0";
        $("queueHint").textContent = "当前没有可背词条。";
        return;
      }

      const deck = getDeck();
      $("cardCount").textContent = `${isReverse ? "中译俄队列" : "随机队列"} ${state.index + 1} / ${deck.length}`;
      $("queueRemaining").textContent = Math.max(deck.length - state.index - 1, 0);
      $("queueHint").textContent = isReverse
        ? "先看中文回忆俄语，翻答案后记录背对或忘记。"
        : "后续词条已隐藏，点“认识”或方向键进入下一张。";
      const plainLength = word.ru.replace(/[́\s-]/g, "").length;
      const size = plainLength > 11 ? 74 : plainLength > 9 ? 82 : plainLength > 7 ? 98 : 112;
      $("ruWord").style.setProperty("--word-size", `${size}px`);
      $("ruWord").textContent = word.ru;
      $("meaning").textContent = word.zh;
      $("ipa").textContent = word.ipa;
      $("roman").textContent = word.roman;
      $("flipBtn").textContent = state.revealed ? "重新自测" : "显示答案";
      $("badBtn").classList.toggle("is-hidden", !state.revealed);
      $("goodBtn").classList.toggle("is-hidden", !state.revealed);
    }

    function makeCloze(word) {
      const letters = Array.from(normalizeRussian(word.ru));
      const span = Math.min(letters.length, Math.floor(Math.random() * 3) + 1);
      const start = Math.max(0, Math.floor(Math.random() * (letters.length - span + 1)));
      const answer = letters.slice(start, start + span).join("");
      const masked = letters.map((letter, index) =>
        index >= start && index < start + span ? "_" : letter
      ).join("");
      return { masked, answer };
    }

    function makeQuiz() {
      const list = getFiltered();
      if (!list.length) return;
      state.quizWord = list[Math.floor(Math.random() * list.length)];
      state.quizLocked = false;
      state.quizAnswer = "";
      state.cloze = null;
      $("quizInput").value = "";
      $("quizFeedback").textContent = "";
      $("quizFeedback").className = "quiz-feedback";
      state.cloze = makeCloze(state.quizWord);
      state.quizAnswer = state.cloze.answer;
      $("quizType").textContent = "补全被挖掉的俄语字母";
      $("clozeWord").textContent = state.cloze.masked;
      $("clozeMeaning").textContent = state.quizWord.zh;
      $("quizInput").placeholder = `输入缺少的 ${state.quizAnswer.length} 个字母`;
      $("quizInput").focus();
    }

    function renderList() {
      const list = sortByBadCount(getFiltered());
      $("listPane").innerHTML = list.map((word) => {
        const p = progressFor(word);
        return `<article class="vocab-card">
          <h3>${word.ru}</h3>
          <p>${word.zh}</p>
          <small>${word.ipa} ${word.roman}</small>
          <small>${word.category} · 认识 ${p.good || 0} · 不认识 ${p.bad || 0}</small>
        </article>`;
      }).join("") || `<div class="empty">没有匹配的词条。</div>`;
    }

    function renderStats() {
      const list = getFiltered();
      const wrong = sortByBadCount(words.filter((word) => {
        const p = progressFor(word);
        return (p.bad || 0) > (p.good || 0);
      }));
      const errorRate = currentRoundRate();
      $("totalCount").textContent = list.length;
      $("learnedCount").textContent = state.round.seen;
      $("wrongCount").textContent = wrong.length;
      $("accuracy").textContent = `${errorRate}%`;
      $("progressBar").style.width = `${errorRate}%`;
      $("activeLabel").textContent = state.category;
      $("wrongLabel").textContent = wrong.length;
      $("wrongList").innerHTML = wrong.slice(0, 12).map((word) => {
        const p = progressFor(word);
        return `<div class="word-row">
          <button data-review="${idFor(word)}"><b>${word.ru}</b><small>${word.zh}</small></button>
          <span class="score-dot">${p.bad || 0}</span>
        </div>`;
      }).join("") || `<div class="empty">还没有错题。</div>`;
    }

    function renderKeyboard() {
      $("ruKeyboard").innerHTML = russianLetters.map((letter) =>
        `<button class="key" type="button" data-letter="${letter}">${letter}</button>`
      ).join("");
    }

    function renderMode() {
      document.querySelectorAll(".mode-tabs button").forEach((button) => {
        button.classList.toggle("active", button.dataset.mode === state.mode);
      });
      $("flashPane").style.display = state.mode === "flash" || state.mode === "reverse" ? "grid" : "none";
      $("quizPane").classList.toggle("active", state.mode === "quiz");
      $("listPane").classList.toggle("active", state.mode === "list");
      if (state.mode === "quiz" && !state.quizWord) makeQuiz();
    }

    function render() {
      renderNav();
      renderMode();
      renderFlash();
      renderList();
      renderStats();
    }

    $("categoryNav").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-category]");
      if (!button) return;
      state.category = button.dataset.category;
      state.index = 0;
      state.revealed = false;
      state.quizWord = null;
      state.deckKey = "";
      render();
    });

    $("searchInput").addEventListener("input", (event) => {
      state.search = event.target.value;
      state.index = 0;
      state.quizWord = null;
      state.deckKey = "";
      render();
    });

    document.querySelector(".mode-tabs").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-mode]");
      if (!button) return;
      state.mode = button.dataset.mode;
      if (state.mode === "quiz") makeQuiz();
      render();
    });

    $("flipBtn").addEventListener("click", () => {
      state.revealed = !state.revealed;
      render();
    });

    $("goodBtn").addEventListener("click", () => {
      const word = currentWord();
      if (!word) return;
      record(word, true);
      toast("已记录背对了");
      nextWord();
    });

    $("badBtn").addEventListener("click", () => {
      const word = currentWord();
      if (!word) return;
      record(word, false);
      toast("已记录忘记了");
      nextWord();
    });

    $("shuffleBtn").addEventListener("click", () => {
      const list = getFiltered();
      if (!list.length) return;
      reshuffleDeck(false);
      state.revealed = false;
      toast("已重新洗牌");
      render();
    });

    $("speakBtn").addEventListener("click", () => speak(currentWord()));

    $("reviewWrongBtn").addEventListener("click", () => {
      state.category = "错题";
      state.mode = "flash";
      state.index = 0;
      state.revealed = false;
      state.deckKey = "";
      render();
    });

    $("resetBtn").addEventListener("click", () => {
      if (!confirm("确定要清空学习记录吗？")) return;
      state.progress = {};
      saveProgress();
      render();
    });

    $("wrongList").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-review]");
      if (!button) return;
      const word = words.find((item) => idFor(item) === button.dataset.review);
      if (!word) return;
      state.category = word.category;
      state.deck = [word, ...shuffleList(getFiltered().filter((item) => idFor(item) !== idFor(word)))];
      state.deckKey = deckKeyFor(getFiltered());
      state.index = 0;
      state.mode = "flash";
      state.revealed = true;
      render();
    });

    $("ruKeyboard").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-letter]");
      if (!button || state.quizLocked) return;
      const input = $("quizInput");
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      input.value = `${input.value.slice(0, start)}${button.dataset.letter}${input.value.slice(end)}`;
      input.focus();
      input.setSelectionRange(start + 1, start + 1);
    });

    $("submitQuizBtn").addEventListener("click", () => {
      if (state.quizLocked || !state.quizWord) return;
      const input = normalizeRussian($("quizInput").value);
      const correct = normalizeRussian(state.quizAnswer);
      const isCorrect = input === correct;
      state.quizLocked = true;
      $("quizFeedback").textContent = isCorrect
        ? "答对了"
        : `答案：${state.quizAnswer}（完整单词：${state.quizWord.ru}）`;
      $("quizFeedback").className = `quiz-feedback ${isCorrect ? "correct" : "wrong"}`;
      record(state.quizWord, isCorrect);
      toast(isCorrect ? "答对了" : "加入错题本");
    });

    $("nextQuizBtn").addEventListener("click", () => {
      makeQuiz();
      renderStats();
    });

    document.addEventListener("keydown", (event) => {
      if (state.mode === "quiz" && event.key === "Enter") {
        event.preventDefault();
        $("submitQuizBtn").click();
        return;
      }
      if (state.mode !== "flash" && state.mode !== "reverse") return;
      if (event.code === "Space") {
        event.preventDefault();
        state.revealed = !state.revealed;
        render();
      }
      if (event.key === "ArrowRight") nextWord();
      if (event.key.toLowerCase() === "s") speak(currentWord());
    });

    renderKeyboard();
    render();
  </script>
</body>
</html>
