  <text x="662" y="555" class="label">教师 AR 眼镜</text>

  <g>
    <rect x="820" y="330" width="285" height="130" rx="14" fill="#ffffff" stroke="#a9b8c9" stroke-width="3" filter="url(#shadow)"/>
    <text x="845" y="365" class="label">AR 实时提示</text>
    <text x="845" y="397" class="small">第三排左侧注意力下降</text>
    <text x="845" y="425" class="small">建议：插入提问或小组讨论</text>
    <circle cx="1060" cy="360" r="14" fill="#f59e0b"/>
