想"}, {"key": "D", "text": "科学发展观"}], "explanation": "重点笔记提示“跨世纪发展”对应江泽民和“三个代表”。", "examPriority": 4, "examPriorityLabel": "常规覆盖", "lastClassPriority": 6, "lastClassPriorityLabel": "本次不考范围", "lastClassReason": "最后一节课明确第五章不考查。", "inFinalScope": false}, {"id": "6d49f178747e", "source": "第五章人工补充单选", "priority": 1, "chapter": "第五章 中国特色社会主义理论体系的形成", "type": "single", "prompt": "“新世纪新阶段的新发展”这一历史定位常对应（ ）。", "answer": "D", "options": [{"key": "A", "text": "毛泽东思想"}, {"key": "B", "text": "邓小平理论"}, {"key": "C", "text": "“三个代表”重要思想"}, {"key": "D", "text": "科学发展观"}], "explanation": "重点笔记提示“新世纪新阶段”对应科学发展观。", "examPriority": 4, "examPriorityLabel": "常规覆盖", "lastClassPriority": 6, "lastClassPriorityLabel": "本次不考范围", "lastClassReason": "最后一节课明确第五章不考查。", "inFinalScope": false}, {"id": "cff413638340", "source": "第五章人工补充单选", "priority": 1, "chapter": "第五章 中国特色社会主义理论体系的形成", "type": "single", "prompt": "中国特色社会主义理论体系的形成发展体现了马克思主义中国化时代化（ ）的理论品格。", "answer": "B", "options": [{"key": "A", "text": "一成不变"}, {"key": "B", "text": "与时俱进"}, {"key": "C", "text": "脱离实践"}, {"key": "D", "text": "照搬照抄"}], "explanation": "这一章的主线是一脉相承又与时俱进。", "examPriority": 4, "examPriorityLabel": "常规覆盖", "lastClassPriority": 6, "lastClassPriorityLabel": "本次不考范围", "lastClassReason": "最后一节课明确第五章不考查。", "inFinalScope": false}, {"id": "9f14c812338b", "source": "第五章人工补充单选", "priority": 1, "chapter": "第五章 中国特色社会主义理论体系的形成", "type": "single", "prompt": "中国特色社会主义理论体系围绕的根本主题是（ ）。", "answer": "A", "options": [{"key": "A", "text": "坚持和发展中国特色社会主义"}, {"key": "B", "text": "完成新民主主义革命"}, {"key": "C", "text": "建立社会主义基本制度"}, {"key": "D", "text": "发动土地革命"}], "explanation": "该理论体系集中回答建设、巩固和发展中国特色社会主义的问题。", "examPriority": 4, "examPriorityLabel": "常规覆盖", "lastClassPriority": 6, "lastClassPriorityLabel": "本次不考范围", "lastClassReason": "最后一节课明确第五章不考查。", "inFinalScope": false}, {"id": "8216ee512131", "source": "第五章人工补充单选", "priority": 1, "chapter": "第五章 中国特色社会主义理论体系的形成", "type": "single", "prompt": "改革开放以来党的全部理论和实践的主题是（ ）。", "answer": "C", "options": [{"key": "A", "text": "民族独立"}, {"key": "B", "text": "人民解放"}, {"key": "C", "text": "中国特色社会主义"}, {"key": "D", "text": "阶级斗争扩大化"}], "explanation": "资料把改革开放以来理论创新归结到中国特色社会主义主题。", "examPriority": 4, "examPriorityLabel": "常规覆盖", "lastClassPriority": 6, "lastClassPriorityLabel": "本次不考范围", "lastClassReason": "最后一节课明确第五章不考查。", "inFinalScope": false}], "essays": [{"id": "61795dead5b3", "source": "23版课后思考题答案", "chapter": "第一章 毛泽东思想及其历史地位", "prompt": "毛泽东思想形成和发展的社会历史条件是什么？", "answer": "答：19世纪末20世纪初，世界进入帝国主义和无产阶级革命时代，战争与革命成为时代主题。马克思主义自19世纪末开始传入中国，20世纪初期得到传播。但当时人们对马克思主义的认识还是零散的、肤浅的。1917年俄国的十月革命和1919年中国的五四运动使马克思列宁主义在中国真正得到广泛传播。正如毛泽东指出，十月革命一声炮响给我们送来了马克思列宁主义。马克思列宁主义在中国的传播，大大提高了中国先进知识分子的思想觉悟，他们以马克思列宁主义为指导，积极地投入到人民群众的斗争中去。正是这些知识分子把马克思列宁主义的基本原理同中国革命的实际情况相结合，才为中国的马克思主义——毛泽东思想的产生奠定了思想基础。毛泽东思想正是在这样的时代条件下形成和发展起来的。\n中国共产党自成立后，为中国人民谋幸福、为中华民族谋复兴，经历了千辛万苦的奋斗历程，有成功的宝贵经验，也有遭受了失败的惨痛教训。这些实践经验激励和促使以毛泽东同志为主要代表的中国共产党人更深入地思考中国革命和建设问题。毛泽东思想正是对这些经验教训进行深刻总结形成的理论成果。没有中国革命和建设的实践经验，没有对中国革命和建设经验的深刻总结，就不可能有毛泽东思想。正是经过长期实践的反复比较，最终选择了毛泽东作为自己的领袖，选择了毛泽东思想作为自己的指导思想。中国共产党领导人民进行革命和建设的成功实践是毛泽东思想形成和发展的实践基础。", "priority": 4, "priorityLabel": "常规覆盖", "priorityReason": "作为章节完整覆盖内容保留。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "最后一课考试范围内章节。", "inFinalScope": true}, {"id": "1987626d7a2a", "source": "23版课后思考题答案", "chapter": "第一章 毛泽东思想及其历史地位", "prompt": "如何把握毛泽东思想的主要内容和活的灵魂？", "answer": "答：（1）毛泽东思想的主要内容\n毛泽东思想是马克思列宁主义在中国的运用和发展，是被实践证明了的关于中国革命和建设的正确的理论原则和经验总结，是中国共产党集体智慧的结晶。毛泽东思想在许多方面以其独创性理论丰富和发展了马克思列宁主义，成为一个博大精深的科学思想体系。主要内容具体包括以下几个方面：\n①新民主主义革命理论\n新民主主义革命理论是毛泽东思想的基石。毛泽东从中国的历史状况和社会状况出发，深刻研究中国革命的特点和规律，发展了马克思列宁主义关于无产阶级在民主革命中的领导思想，创立了无产阶级领导的，工农联盟为基础的，人民大众的，反对帝国主义、封建主义和官僚资本主义的新民主主义革命的理论。\n②社会主义革命和社会主义建设理论\n毛泽东思想中关于社会主义革命和社会主义建设的理论，具有很大的探索性和先导性。毛泽东从理论和实践上解决了如何在中国这样一个占世界人口1/4的、经济文化落后的大国建立社会主义制度这一重大问题。这方面的理论主要包括四个方面：创造性地实现了生产资料私有制的社会主义改造；提出人民民主专政理论，丰富了无产阶级专政的学说；提出社会主义建设的十大关系；创造性地提出两类矛盾学说和正确处理人民内部矛盾的理论。\n③革命军队建设和军事战略的理论\n毛泽东系统解决了如何把以农民为主要成分的革命军队建设成为一支无产阶级性质的、具有严格纪律的、同人民群众保持密切联系的新型人民军队的问题，解决了如何开展人民革命战争，应当实行什么样的战略战术，如何巩固国防等一系列重大方针问题。这一领域主要包含五方面的内容：系统地解决了建设新型人民军队的问题；系统地提出了建设人民军队的思想；提出了人民战争的思想；制定了人民战争的战略、战术原则；提出了建设和发展现代化国防技术的重要思想。\n④政策和策略的理论\n毛泽东思想中关于政策和策略的内容涉及方方面面，非常广泛，主要围绕两大方面展开：精辟地论证了革命斗争中政策和策略问题的极端重要性；在统一战线中提出了许多重要的政策和策略思想。\n⑤思想政治工作和文化工作的理论\n思想政治工作是一切工作的生命线。“一定的文化（当做是观念形态的文化）是一定社会的政治和经济的反映，又给予伟大影响和作用于一定社会的政治和经济；而经济是基础，政治则是经济的集中的表现”掌握思想教育，是团结全党进行伟大政治斗争的中心环节。毛泽东对此提出了许多具有长远意义的重要思想。\n⑥党的建设理论\n毛泽东的建党学说成功地解决了在中国这样一个农民和其他小资产阶级占人口大多数的国家里，建设一个马克思主义的无产阶级政党的问题。在这方面主要包含五方面的内容：从思想上建党；理论和实践相结合的作风；“惩前毖后、治病救人”的正确方针；创造了通过批评和自我批评进行马克思列宁主义思想教育的整风形式；要继续保持谦虚谨慎、戒骄戒躁、艰苦奋斗的作风。\n除了以上6个方面外，毛泽东思想体系中还有关于国际战略和外交工作的理论、关于思想方法和工作方法的理论，等等。毛泽东的哲学著作和其他许多蕴涵着丰富哲学思想的著作，在总结中国革命和建设的经验教训中，深刻地论述和丰富了马克思主义的认识论、辩证法和历史观。\n（2）毛泽东思想活的灵魂\n毛泽东思想的活的灵魂，是贯穿于其各个组成部分的立场、观点和方法它们有三个基本方面，即实事求是、群众路线、独立自主。\n实事求是\n实事求是，就是从实际出发，理论联系实际，就是要把马克思列宁主义普遍原理同中国革命具体实践相结合，反对离开中国社会和中国革命的实际去研究马克思主义。毛泽东指出：“ ‘实事’就是客观存在着的一切事物，‘是’就是客观事物的内部联系，即规律性，‘求’就是我们去研究。”具体要求如下：\n坚持实事求是，就要深入实际了解事物的本来面貌，把握事物内在必然联系，按照客观规律办事。\n坚持实事求是，就要清醒认识和正确把握我国基本国情。\n坚持实事求是，就要不断推进实践基础上的理论创新。\n群众路线\n群众路线，即一切为了群众，一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动。把马克思列宁主义关于人民群众是历史的创造者的原理系统地运用在党的全部活动中，形成党在一切工作中的群众路线，这是我们党长期在敌我力量悬殊的艰难环境里进行革命活动的无比宝贵的历史经验的总结。只有坚持这一基本原理，我们才能把握历史前进的基本规律。具体要求如下：\n坚持群众路线，就要坚持人民是推动历史发展的根本力量。\n坚持群众路线，就要坚持全心全意为人民服务的根本宗旨。\n坚持群众路线，就要保持党同人民群众的血肉联系。\n独立自主\n独立自主，是党从中国实际出发、依靠党和人民力量进行革命、建设、改革的必然结论。具体要求如下：\n坚持独立自主，就要坚持中国的事情必须由中国人民作主张、自己来处理。\n坚持独立自主，始终坚持独立自主的和平外交政策，坚持走和平发展道路。既通过维护世界和平发展自己，又通过自身发展维护世界和平。\n毛泽东思想的活的灵魂，既体现了马克思主义的立场、观点、方法，又具有中国共产党人的特色；既贯穿于毛泽东的全部科学著作和党的重要文献中，又表现在中国共产党人的实践活动中，是党和人民十分宝贵的精神财富。", "priority": 2, "priorityLabel": "综合备用", "priorityReason": "可用于党的建设、统一战线、综合题和理论体系题。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "最后一课考试范围内章节。", "inFinalScope": true}, {"id": "75d283971ed0", "source": "23版课后思考题答案", "chapter": "第一章 毛泽东思想及其历史地位", "prompt": "如何科学认识毛泽东思想的历史地位？", "answer": "答：毛泽东思想具有重要的历史地位主要体现为：\n马克思主义中国化时代化的第一个重大理论成果\n毛泽东思想是马克思主义中国化时代化第一次历史性飞跃的理论成果，在新民主主义革命、社会主义革命和建设、军队和国防建设、政策和策略、思想政治工作和文化工作、外交工作和党的建设等方面，以独创性的理论丰富和发展了马克思列宁主义。\n中国革命和建设的科学指南\n在毛泽东思想的指导下，我们党领导全国人民，找到了一条新民主主义革命的正确道路，推翻了帝国主义、封建主义和官僚资本主义，建立了中华人民共和国，实现了中国从几千年封建专制政治向人民民主的伟大飞跃，确立了社会主义基本制度，实现了中华民族有史以来最为广泛而深刻的社会变革，实现了一穷二白、人口众多的东方大国大步迈进社会主义社会的伟大飞跃。对适合中国国情的社会主义道路进行了艰辛探索，取得了独创性理论成果和巨大成就，为在新的历史时期开创中国特色社会主义提供了宝贵经验、理论准备、物质基础。\n毛泽东思想关于社会主义建设的基本思想观点，对于建设和发展中国特色社会主义仍然具有十分重要的现实指导作用。\n（3）中国共产党和中国人民宝贵的精神财富\n毛泽东追求和倡导的中华民族重新自立于世界民族之林的远大理想，实事求是的思想路线，全心全意为人民服务的根本宗旨，自力更生、艰苦奋斗的革命精神，等等，依然是中国人民不断奋进的强大精神动力，将长期激励和指导我们前进。\n要对毛泽东思想的历史地位作出科学的、实事求是的评价，正确认识毛泽东的功绩是第一位的，错误是第二位的。毛泽东思想是党的指导思想，是关于中国革命和建设的正确理论原则和经验总结，毛泽东确立的一切从中国实际出发、理论联系实际的思想原则，已成为党的思想路线。毛泽东著作中包含的许多基本原理、原则和科学方法，是有普遍意义的，不管现在还是今后对我们都具有重要的指导作用。", "priority": 2, "priorityLabel": "综合备用", "priorityReason": "可用于党的建设、统一战线、综合题和理论体系题。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "最后一课考试范围内章节。", "inFinalScope": true}, {"id": "d74f4acd9342", "source": "23版课后思考题答案", "chapter": "第二章 新民主主义革命理论", "prompt": "什么是新民主主义革命的总路线？", "answer": "答：1948年4月，毛泽东《在晋绥干部会议上的讲话》中，第一次全面、系统地提出了新民主主义革命的总路线和总政策，即“无产阶级领导的，人民大众的，反对帝国主义、反对封建主义和反对官僚资本主义的革命”。这是新民主主义革命总路线完整的科学表述。这条总路线包含着三个基本点，即：\n这个革命的领导权属于无产阶级及其政党，而不属于资产阶级及其政党；\n这个革命的参加者是以农民及其他小资产阶级为主体的人民群众。其中包括民族资产阶级及其他爱国人士在内；\n这个革命的对象只能是和必须是帝国主义、封建主义以及与它们有联系的官僚资本主义和官僚资产阶级，而不能是和不应当是一般的资本主义和一般的资产阶级。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增考前情报直接命中或高度相关。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "最后一课考试范围内章节。", "inFinalScope": true}, {"id": "cb948cc9c910", "source": "23版课后思考题答案", "chapter": "第二章 新民主主义革命理论", "prompt": "新民主主义基本纲领的主要内容是什么？", "answer": "答：新民主主义基本纲领的主要内容为：\n政治纲领：推翻帝国主义和封建主义的统治，建立一个无产阶级领导的、以工农联盟为基础的、各革命阶级联合专政的新民主主义的共和国。\n经济纲领：没收封建地主阶级的土地归农民所有，没收官僚资产阶级的垄断资本归新民主主义的国家所有，保护民族工商业。\n没收封建地主阶级的土地归农民所有，是新民主主义革命的主要内容。\n没收官僚资本归新民主主义国家所有，是新民主主义革命的题中应有之义。\n保护民族工商业，是新民主主义经济纲领中极具特色的一项内容。\n文化纲领：无产阶级领导的人民大众的反帝反封建的文化，即民族的、科学的、大众的文化。\n新民主主义文化是民族的，就其内容说是反对帝国主义压迫，主张中华民族的尊严和独立。\n新民主主义文化是科学的，是反对一切封建思想和迷信思想，主张实事求是、客观真理及理论和实践的一致性。同时要尊重中国的历史，反对民族虚无主义，以历史唯物主义的态度对待古今中外文化，发展民族新文化，提高民族自信心。\n新民主主义文化是人民大众的文化，也就是民主的文化。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增考前情报直接命中或高度相关。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "最后一课考试范围内章节。", "inFinalScope": true}, {"id": "accee42abe82", "source": "23版课后思考题答案", "chapter": "第二章 新民主主义革命理论", "prompt": "如何认识中国革命走农村包围城市、武装夺取政权道路的必要性及重大意义？", "answer": "答：（1）中国革命走农村包围城市、武装夺取政权道路的必要性\n中国是一个半殖民地半封建的国家，对外没有民族独立，对内没有民主制度，国民党反动政权凭借其武装力量对人民实行恐怖统治。因此，无产阶级只能用革命的武装反对反革命的武装，走武装夺取政权的道路。\n农民占中国人的绝大多数，是中国革命的主力军。无产阶级要领导中国革命取得胜利，就必须深入农村，建立广大的农村革命根据地，开展土地革命。这是半殖民地半封建社会的中国，在无产阶级领导下农民斗争的最高形式。\n中国革命的敌人异常强大，并长期占领中心城市，广大农村是国民党反动统治的薄弱地区。这就决定了中国革命只能走首先在广大农村聚集力量，以农村包围城市、武装夺取政权，最终夺取全国政权而胜利的道路。\n（2）中国革命走农村包围城市、武装夺取政权道路的重大意义\n实现了中国革命由城市向农村的历史性转变和党的工作重心由城市向农村的转变，从而保存和发展了革命力量。\n揭示了中国革命发展的客观规律，指明了中国革命的正确方向，指出了大革命失败后中国革命走向胜利的正确道路。\n丰富和发展了马克思主义关于暴力革命的学说，为殖民地半殖民地国家的人民解放斗争提供了重要经验。\n中国革命道路理论，对于推进马克思主义中国化具有重要的方法论意义。\n在该理论的指导下，经过浴血奋战，中国完成了新民主主义革命，于1949年建立了中华人民共和国。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增考前情报直接命中或高度相关。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第二章重点：革命道路与三大法宝。", "inFinalScope": true}, {"id": "55b4fd3f019e", "source": "23版课后思考题答案", "chapter": "第二章 新民主主义革命理论", "prompt": "如何理解新民主主义革命的三大法宝及其相互关系？", "answer": "答：（1）新民主主义革命的三大法宝\n新民主主义革命的三大法宝是指毛泽东在《〈共产党人〉发刊词》一文中提出的党在中国革命中战胜敌人的三个主要的法宝，即统一战线、武装斗争和党的建设。\n（2）新民主主义革命的三大法宝之间的相互关系这三者之间的关系密切相连：\n统一战线和武装斗争是中国革命的两个基本特点，是战胜敌人的两个基本武器；\n统一战线是实行武装斗争的统一战线，武装斗争是统一战线的中心支柱，党的组织则是掌握统一战线和武装斗争这两个武器以实行对敌冲锋陷阵的英勇战士。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增考前情报直接命中或高度相关。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第二章重点：革命道路与三大法宝。", "inFinalScope": true}, {"id": "d9fe7c698914", "source": "23版课后思考题答案", "chapter": "第三章 社会主义改造理论", "prompt": "新民主主义社会为什么是一个过渡性社会？", "answer": "答：新民主主义社会是一个过渡性社会，其主要原因在于：\n新民主主义社会有五种经济成分，但主要是三种：社会主义经济、个体经济、资本主义经济。\n与三种不同性质的经济成分相联系的中国社会阶级结构有三种基本的阶级力量：工人阶级、农民和其他小资产阶级、民族资产阶级。\n随着土地改革的基本完成，工人阶级和资产阶级的矛盾逐步成为国内的主要矛盾。而解决这一矛盾，必然使中国社会实现向社会主义的转变。\n新民主主义社会是属于社会主义体系的，社会主义因素已在经济、政治上都已居于领导地位，但非社会主义因素的比重还很大，所以，它还不完全属于社会主义社会，因此必须在适当的时候过渡到社会主义社会。", "priority": 4, "priorityLabel": "常规覆盖", "priorityReason": "作为章节完整覆盖内容保留。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "最后一课考试范围内章节。", "inFinalScope": true}, {"id": "97c53f9dc62c", "source": "23版课后思考题答案", "chapter": "第三章 社会主义改造理论", "prompt": "怎样理解党在过渡时期的总路线？", "answer": "答：可以从以下几个方面来理解党在过渡时期的总路线：\n党在过渡时期的总路线的提出\n1953年6月，毛泽东在中央政治局会议上正式提出过渡时期的总路线和总任务，同年12月形成了关于总路线的完整表述：“从中华人民共和国成立，到社会主义改造基本完成，这是一个过渡时期。党在这个过渡时期的总路线和总任务，是要在一个相当长的时期内，逐步实现国家的社会主义工业化，并逐步实现国家对农业、对手工业和对资本主义工商业的社会主义改造。”\n党在过渡时期总路线的主要内容\n党在过渡时期总路线的主要内容为“一化三改”。“一化”，即社会主义工业化。“三改”，即对个体农业、手工业和资本主义工商业的社会主义改造。两者相互联系、不可分离、相辅相成、相互促进。\n党在过渡时期总路线的理论依据\n马克思、恩格斯在创立科学社会主义理论时，就提出了从资本主义社会向社会主义社会过渡的问题。\n列宁在指导俄国无产阶级革命和世界被压迫民族解放斗争中，进一步发展了马克思、恩格斯的革命转变思想。\n对党在过渡时期总路线的评价\n这是一条社会主义建设和社会主义改造同时并举的路线，体现了社会主义工业化和社会主义改造的紧密结合，体现了解放生产力与发展生产力、变革生产关系与发展生产力的有机统一。\n党在过渡时期的总路线是马克思列宁主义关于过渡时期的理论在中国的具体化，形成了中国化的过渡时期理论，为中国社会主义改造提供了行动指南。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增考前情报直接命中或高度相关。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第三章核心板块：过渡时期总路线、一化三改。", "inFinalScope": true}, {"id": "32f95a53fe52", "source": "23版课后思考题答案", "chapter": "第三章 社会主义改造理论", "prompt": "如何认识我国社会主义改造的基本经验？", "answer": "答：我国社会主义改造的基本经验主要包括：\n坚持社会主义工业化建设与社会主义改造同时并举。实践证明，党坚持社会主义改造与社会主义工业化同时并举的方针，对于在深刻的社会变革中保持社会稳定，促进生产力发展，逐步改善人民生活，推动社会进步，都具有十分重要的意义。\n采取积极引导、逐步过渡的方式。我国对农业、手工业和资本主义工商业的改造，都采取了区别对象、积极引导、逐步过渡的方式。中国这场巨大而深刻的社会变革，不仅没有对生产力的发展造成破坏，而且促进了生产力的发展。\n用和平方法进行改造。无论是资本主义工商业，还是农民和手工业者的个体所有制，都具有私有制的性质。对其进行改造，属于社会主义革命性质。坚持用和平的办法，不仅保证了我国社会主义改造的顺利进行，而且维护了社会的稳定，极大地促进了社会主义事业的发展。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增考前情报直接命中或高度相关。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "最后一课考试范围内章节。", "inFinalScope": true}, {"id": "9682b68800f1", "source": "23版课后思考题答案", "chapter": "第三章 社会主义改造理论", "prompt": "如何理解中国确立社会主义基本制度的重大意义？", "answer": "答：中国确立社会主义基本制度的重大意义主要表现为：\n（1）社会主义基本制度的确立是中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了制度基础，也为中国特色社会主义制度的创新和发展提供了重要前提，奠定我国社会主义工业化的初步基础。\n（2）社会主义基本制度的确立，极大地提高了工人阶级和广大劳动人民的积极性、创造性，极大地促进了我国社会生产力的发展，奠定了我国社会主义工业化的初步基础。社会主义基本制度以其与社会化大生产的一致性和能够在经济落后条件下尽可能地集中力量办大事的优势，为发展社会生产力开辟了广阔的道路。社会主义基本制度的确立，使广大劳动人民真正成为国家的主人。极大地巩固和扩大了工人阶级领导的、以工农联盟为基础的人民民主专政国家政权的阶级基础和经济基础。\n（3）中国社会主义基本制度的确立，使占世界人口1/4的东方大国进入了社会主义社会，这是世界社会主义发展史上又一个历史性的伟大胜利。它进一步改变了世界政治经济格局，增强了社会主义的力量，对维护世界和平产生了积极影响。\n（4）社会主义基本制度的确立，是以毛泽东为主要代表的中国共产党人对脱胎于半殖民地半封建社会的东方大国如何进行社会主义革命问题的系统回答和正确解决，是马克思列宁主义关于社会主义革命理论在中国的正确运用和创造性发展的结果。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增考前情报直接命中或高度相关。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "最后一课考试范围内章节。", "inFinalScope": true}, {"id": "aef6ecebd4b2", "source": "23版课后思考题答案", "chapter": "第四章 社会主义建设道路初步探索", "prompt": "党在社会主义建设道路的初步探索中取得了哪些重要的理论成果？", "answer": "答：党在社会主义建设道路的初步探索中取得的重要的理论成果主要有：\n调动一切积极因素为社会主义事业服务的思想\n调动一切积极因素为社会主义事业服务，必须坚持中国共产党的领导。\n调动一切积极因素为社会主义事业服务，必须发展社会主义民主政治。\n调动一切积极因素为社会主义事业服务，有一个如何认识社会主义发展阶段和社会主义建设规律的问题。\n正确认识和处理社会主义社会矛盾的思想\n在社会主义社会中，基本的矛盾仍然是生产关系和生产力之间的矛盾，上层建筑和经济基础之间的矛盾。它不是对抗性的矛盾，而是非对抗性的矛盾。\n具有“又相适应又相矛盾”的特点，一方面社会主义生产关系已经建立起来，它是和生产力的发展相适应的；另一方面它还很不完善，这些不完善的方面和生产力的发展又是相矛盾的。\n走中国工业化道路的思想。\n以工业为主导，把重工业作为我国经济建设的重点，逐步建立独立的比较完整的基础工业体系和国防工业体系，这是维护国家独立、统一和安全，实现国家富强所必需的。但同时必须充分注意发展农业和轻工业。\n以农业为基础，以工业为主导，以农轻重为序发展国民经济的总方针，以及一整套“两条腿走路”的工业化发展思路，即重工业和轻工业同时并举，中央工业和地方工业同时并举，沿海工业和内地工业同时并举，大型企业和中小型企业同时并举要求包括：a．必须明确战略目标和战略步骤；b．必须采取正确的经济建设方针；c．必须发展科学技术和文化教育；d．必须重视知识分子工作；e．必须调整和完善所有制结构；f．必须积极探索适合我国情况的经济体制和运行机制。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增考前情报直接命中或高度相关。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "老师明确说中国工业化道路是第四章最高优先级。", "inFinalScope": true}, {"id": "2024cdce703f", "source": "23版课后思考题答案", "chapter": "第四章 社会主义建设道路初步探索", "prompt": "如何认识党对社会主义建设道路初步探索的重大意义？", "answer": "答：党在探索社会主义建设道路过程中取得的重要理论成果，是毛泽东思想的重要组成部分，丰富和发展了科学社会主义，成为中国特色社会主义理论体系的重要思想来源，同时，为中国特色社会主义实践提供了重要的思想和理论指导。\n党对社会主义建设道路初步探索的重大意义主要体现为：\n巩固和发展了我国的社会主义制度。面对严峻复杂的国内外形势，党带领全国人民，坚持独立自主、自力更生，进行大规模的社会主义建设，取得了重大成就，体现了社会主义制度的优越性，增强了广大人民群众走社会主义道路的信心，也使得社会主义制度在实践中得到发展。\n为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础。无论是成功的经验还是失败的教训，都是党的宝贵财富，为新时期中国特色社会主义的开创和发展提供了重要的思想资源，所取得的成就为开启新时期新道路奠定了重要的物质基础。\n丰富了科学社会主义的理论和实践。党领导人民探索社会主义道路，汲取苏联模式的经验教训，根据自己的实践形成了许多独创性的成果，深化了对社会主义的认识，不仅丰富了中国社会主义的理论与实践，也丰富了科学社会主义的理论与实践，为其他国家的社会主义建设提供了经验和借鉴。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增考前情报直接命中或高度相关。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "最后一课考试范围内章节。", "inFinalScope": true}, {"id": "756887ba93dc", "source": "23版课后思考题答案", "chapter": "第四章 社会主义建设道路初步探索", "prompt": "党对社会主义建设道路的初步探索有哪些经验教训？", "answer": "答：党在社会主义道路的初步探索中，虽然取得了巨大成就，但同时也遇到了严重的挫折。主要经验教训包括：\n必须把马克思主义与中国实际相结合，探索符合中国特点的社会主义建设道路。不能简单地照搬照抄马克思主义，而应该将它同中国的具体实际相结合，释放出更大的力量，开辟适合中国特点的，符合中国国情的中国特色社会主义道路。\n必须正确认识社会主义社会的主要矛盾和根本任务，集中力量发展生产力。 在整个社会主义初级阶段，要始终坚持党对我国社会主要矛盾的科学判断，以经济建设为中心，不断提高人民的物质文化水平。对于社会主义社会存在的阶级斗争，注意不能把阶级斗争扩大化，搞大规模的政治运动。\n必须从实际出发进行社会主义建设，建设规模和速度要和国力相适应，不能急于求成。从实际出发，从不断进行社会主义建设的过程中，增强对社会主义规律的认识，最终到达自由王国。\n必须发展社会主义民主，健全社会主义法制。要实现社会主义现代化就必须发展社会主义民主，健全社会主义法治。大力发展人民民主，确保人民行使当家作主的权利，使公民的民主权利得到切实保障；党必须在宪法和法律范围内活动，各种制度和法律不能因领导人的改变而改变，不能因领导人看法和注意力的改变而改变。\n必须坚持党的民主集中制和集体领导制度，加强执政党建设。健全民主集中制和集体领导制度，加强执政党建设，是社会主义事业顺利发展的政治保证。民主集中制是无产阶级政党的根本组织原则，是指导党内生活的基本准则。必须大力发扬党内民主，确保党员的民主权利。\n必须坚持对外开放，借鉴和吸收人类文明成果建设社会主义，不能关起门来搞建设。社会形态的不同不能成为我们闭关自锁，不与资本主义国家发生联系的原因，我们社会主义国家应该要比资本主义国家创造出更大的生产力，为此，我们要在平等的基础上开展同一切国家的经济技术交流，包括同一些资本主义国家发展经济贸易关系，并提出要学习一切国家和民族的长处。历史的经验教训告诉我们，关起门来搞建设是不行的，发展不起来。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增考前情报直接命中或高度相关。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "最后一课考试范围内章节。", "inFinalScope": true}, {"id": "cb20b42c7358", "source": "23版课后思考题答案", "chapter": "第五章 中国特色社会主义理论体系的形成", "prompt": "中国特色社会主义理论体系形成发展的社会历史条件是什么？", "answer": "答：中国特色社会主义理论体系是中国共产党人把马克思主义基本原理同中国具体实际相结合，在总结我国改革开放和社会主义现代化建设的实践经验，汲取其他社会主义国家兴衰成败的历史经验，并借鉴其他国家发展经验教训的基础\n上，逐步形成和发展起来的。中国特色社会主义理论体系形成和发展的社会历史条件由以下三方面组成：\n（1）国际背景\n第二次世界大战结束后特别是20世纪70年代以来，世界多极化和经济全球化深入发展，整个世界发生着剧烈而深刻的大变动大调整，和平与发展成为时代主题。科学技术的突飞猛进，极大地推动了世界生产力和人类经济社会的发展，也引起全球政治格局、经济格局、安全格局发生了前所未有的重大变化。\n20世纪80年代末90年代初，东欧剧变、苏联解体，国际局势发生深刻变化。以美国为首的霸权主义和强权政治，一些地区的冲突以及恐怖主义，导致世界很不安宁。但和平与发展仍然是时代的主题，世界多极化不断发展，经济全球化的浪潮蓬勃发展，以经济为基础、以科技为先导的综合国力竞争空前激烈。\n进入21世纪，世界处在大发展大变革大调整之中。和平与发展仍然是时代主题，世界多极化不可逆转，经济全球化深入发展，科技革命加速推进，各国相互依存逐步加深，大国关系深刻变动，国际力量对比朝着有利于维护世界和平方向发展。同时，国际环境中不稳定不确定因素增多。\n党的十八大以来，当今世界正在经历百年未有之大变局，世界多极化、经济全球化、社会信息化、文化多样化深入发展，全球治理体系和国际秩序变革加速推进，新兴市场国家和发展中国家快速崛起，国际力量对比更趋均衡，世界各国人民的命运从未像今天这样紧紧相连。同时，世界面临的不稳定性不确定性突出，经济全球化遭遇逆流，世界经济增长乏力，民粹主义、排外主义等思潮不断抬头，保护主义、单边主义、霸权主义对世界和平与发展构成威胁。贫富分化日益严重，地区热点问题此起彼伏，恐怖主义、网络安全、重大传染性疾病、气候变化等非传统安全威胁持续蔓延。国际经济、科技、文化、安全、政治等格局都在发生深刻复杂变化。\n（2）历史条件\n社会主义建设的经验教训是中国特色社会主义理论体系形成的历史条件。在改革开放和社会主义现代化建设进程中，我们党认真汲取其他国家特别是苏联、东欧等社会主义国家的经验教训，为更好地发展中国特色社会主义提供了重要借鉴。\n“三个代表”重要思想是在科学判断党的历史方位和总结历史经验的基础上提出来的我们党历经革命、建设和改革，已经从领导人民为夺取全国政权而奋斗的党，成为领导人民掌握全国政权并长期执政的党；已经从受到外部封锁和实行计划经济条件下领导国家建设的党，成为对外开放和发展社会主义市场经济条件下领导国家建设的党。党所处的地位和环境、党所肩负的历史任务、党的自身状况，都发生了新的重大变化。\n科学发展观是在深刻把握我国基本国情和新的阶段性特征的基础上形成和发展的。经过新中国成立以来特别是改革开放以来的不懈努力，我国经济社会发展取得了举世瞩目的成就，但仍处于并将长期处于社会主义初级阶段的基本国情没有变。进入新世纪新阶段，我国进入发展关键期、改革攻坚期和矛盾凸显期，经济社会发展呈现一系列新的阶段性特征。\n新时代是习近平新时代中国特色社会主义思想产生的深厚的社会历史基础和前提条件。新中国成立以来特别是改革开放以来，我国经济社会发展取得重大成就。我国社会生产力水平总体上显著提高，国家综合国力跃上新的大台阶，国际影响力显著提升。经济运行总体平稳，经济结构持续优化，生态环境明显改善，对外开放持续扩大；脱贫攻坚成果举世瞩目，人民生活水平显著提高；文化事业和文化产业繁荣发展；国防和军队建设水平大幅提升；国家安全全面加强，社会保持和谐稳定；生态文明建设成效之大前所未有。全面建成小康社会目标将如期实现，中华民族伟大复兴不断取得重大进展，我国发展站到了新的历史起点上。\n（3）实践基础\n实践是理论创新的源泉。中国特色社会主义理论体系不仅源于实践，而且尊重实践，尊重人民，时刻关注最广大人民群众的利益和愿望，善于概括人民群众的经验和创造。改革开放和社会主义现代化建设的生动实践，是中国特色社会主义理论体系形成和发展的实践基础。中国特色社会主义理论体系的形成和发展，离不开对新中国成立以来社会主义建设的实践经验，特别是改革开放以来社会主义现代化建设实践经验的科学总结。", "priority": 4, "priorityLabel": "常规覆盖", "priorityReason": "作为章节完整覆盖内容保留。", "lastClassPriority": 6, "lastClassPriorityLabel": "本次不考范围", "lastClassReason": "最后一节课明确第五章不考查。", "inFinalScope": false}, {"id": "899e04509f9f", "source": "23版课后思考题答案", "chapter": "第五章 中国特色社会主义理论体系的形成", "prompt": "如何把握中国特色社会主义理论体系形成发展过程？", "answer": "答：中国特色社会主义理论体系形成发展过程可以分为四个阶段：形成、跨世纪发展、在新世纪新阶段的新发展、在新时代的新篇章。\n形成阶段\n“文化大革命”结束后，“中国向何处去”成为摆在中国人民面前头等重要的问题。邓小平以他的远见卓识、丰富政治经验、高超领导艺术，强调实事求是是毛泽东思想的精髓，旗帜鲜明反对“两个凡是”的错误观点，支持和领导开展真理标准问题的讨论，推动进行各方面的拨乱反正。邓小平作为中国特色社会主义理论的创立者，紧紧抓住“什么是社会主义、怎样建设社会主义”这个基本问题，响亮提出“走自己的道路，建设有中国特色的社会主义”的伟大号召，从此中国特色社会主义成为我们党全部理论和实践一以贯之的主题。邓小平深刻总结我国社会主义建设正反两方面经验，借鉴世界社会主义历史经验，作出把党和国家的工作中心转移到经济建设上来、实行改革开放的历史性决策，深刻揭示社会主义本质，确立社会主义初级阶段基本路线，明确提出走自己的路、建设中国特色社会主义，科学回答了建设中国特色社会主义的一系列基本问题，建构了中国特色社会主义理论体系的基本框架。\n跨世纪发展\n“三个代表”重要思想紧密结合时代发展的新形势，进一步把理论和实践、继承和发展结合起来，在建设中国特色社会主义的实践中，进一步加深对“什么是社会主义、怎样建设社会主义和建设什么样的党、怎样建设党”的认识而形成的重要思想，创造性地运用了马克思列宁主义、毛泽东思想特别是邓小平理论，形成了富有独创性的新的理论成果。“三个代表”重要思想是对马克思列宁主义、毛泽东思想和邓小平理论的继承和发展，是中国特色社会主义理论体系的跨世纪的发展。\n在新世纪新阶段的新发展\n科学发展观是我们党根据新的发展要求，在准确把握世界发展趋势、认真总结我国发展经验、深入分析我国发展阶段性特征的基础上提出来的，是我们党坚持把马克思主义基本原理同新世纪新阶段中国实际和时代特征相结合，继续拓展中国特色社会主义实践、探索中国特色社会主义规律的理论成果，深化了对经济社会发展一般规律的认识，是马克思主义关于发展的世界观和方法论的集中体现，是中国特色社会主义理论体系在新世纪新阶段的新发展。\n在新时代的新篇章\n习近平新时代中国特色社会主义思想是在中国特色社会主义进入新时代、世界正经历百年未有之大变局、中华民族伟大复兴正处于关键时期的社会历史条件中应运而生并不断丰富发展的科学理论。习近平新时代中国特色社会主义思想围绕新时代坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义，提出了“八个明确”核心观点和“十四个坚持”基本方略，是一个主题鲜明、系统全面、逻辑严密、内涵丰富、内在统一的科学理论体系。习近平新时代中国特色社会主义思想是中国特色社会主义理论体系在新时代的新篇章。", "priority": 4, "priorityLabel": "常规覆盖", "priorityReason": "作为章节完整覆盖内容保留。", "lastClassPriority": 6, "lastClassPriorityLabel": "本次不考范围", "lastClassReason": "最后一节课明确第五章不考查。", "inFinalScope": false}, {"id": "89e02ae0fefe", "source": "23版课后思考题答案", "chapter": "第六章 邓小平理论", "prompt": "如何理解邓小平理论首要的基本的理论问题？", "answer": "答：在中国这样一个经济文化比较落后的国家建设什么样的社会主义、怎样建设社会主义是邓小平理论首要的基本的理论问题，解决这一问题的关键是要在坚持社会主义基本制度的基础上进一步认清社会主义的本质。\n1992年初，邓小平在南方谈话中对社会主义本质作出了总结性的理论概括，他指出：社会主义的本质，是解放生产力，发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。邓小平对社会主义本质的概括，既包括了社会主义社会的生产力问题，又包括了社会主义社会的生产关系问题，是一个有机的整体。\n突出地强调解放和发展生产力在社会主义社会发展中的重要地位，纠正了过去关于发展生产力的一些错误观念，反映了中国社会主义整个历史阶段尤其是初级阶段特别需要注重生产力发展的迫切要求，并明确了社会主义基本制度建立后还要通过改革进一步解放生产力。\n突出地强调“消灭剥削，消除两极分化，最终达到共同富裕”，从生产关系和发展目标角度认识和把握社会主义本质。\n邓小平关于社会主义本质的概括，反映了人民的利益和时代的要求，廓清了不合乎时代进步和社会发展规律的模糊观念，摆脱了长期以来拘泥于具体模式而忽略社会主义本质的错误倾向，把对社会主义的认识提高到新的科学水平。", "priority": 4, "priorityLabel": "常规覆盖", "priorityReason": "作为章节完整覆盖内容保留。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第六章重点：社会主义本质与共同富裕。", "inFinalScope": true}, {"id": "52e141fdebf8", "source": "23版课后思考题答案", "chapter": "第六章 邓小平理论", "prompt": "如何把握邓小平理论的主要内容？", "answer": "答：可以从以下几个方面把握邓小平理论的主要内容：\n党的十三大系统阐述了社会主义初级阶段的科学内涵\n阐明了社会主义初级阶段这个论断包括两层含义：第一，我国社会已经是社会主义社会。我们必须坚持而不能离开社会主义。第二，我国的社会主义社会还处在初级阶段。我们必须从这个实际出发，而不能超越这个阶段。\n强调了社会主义初级阶段的长期性。\n阐述了社会主义初级阶段的基本特征。\n邓小平提出党的基本路线：领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强、民主、文明的社会主义现代化国家而奋斗。\n社会主义根本任务的理论。社会主义的根本任务是发展生产力，党和国家的工作重点是经济建设，这是党对我国社会主义建设经验教训和社会主要矛盾进行科学分析得出的最重要的结论。中国解决所有问题的关键是要靠自己的发展。科学技术是第一生产力。\n“三步走”的发展战略，把我国社会主义现代化建设的目标具体化为切实可行的步骤，为基本实现现代化明确了发展方向，成为全国人民团结奋斗的行动纲领。提出了“台阶式”发展的思想，以及允许和鼓励一部分地区、一部分人先富起来逐步实现共同富裕的思想。\n社会主义改革开放理论\n改革是一场深刻的社会变革，是中国的第二次革命；改革的实质和目标是要从根本上改变束缚我国生产力发展的经济体制，建立充满生机和活力的社会主义新经济体制，同时相应地改革政治体制和其他方面的体制，以实现中国的社会主义现代化。改革是社会主义制度的自我完善和发展。\n判断改革和各方面是非得失的标准是“三个有利于”标准，即：是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民生活水平。\n对外开放是建设中国特色社会主义的一项基本国策和改革一起成为新时期最鲜明的特征。\n社会主义市场经济理论。邓小平的社会主义市场经济理论有丰富的内涵：\n计划经济和市场经济不是划分社会制度的标志，计划经济不等于社会主义，市场经济也不等于资本主义；\n计划和市场都是经济手段，对经济活动的调节各有优劣，社会主义实行市场经济是要把两者优势结合起来；\n市场经济作为资源配置手段本身不具有制度属性，可以和不同的社会制度结合，从而表现出不同的性质。坚持社会主义制度与市场经济的结合，是社会主义市场经济的特色所在、优势所在。\n“两手抓，两手都要硬”。邓小平社会主义精神文明建设思想中，一手抓物质文明，一手抓精神文明，“两手抓，两手都要硬”具有鲜明的特色。\n强调社会主义国家不但要有高度的物质文明，而且要有高度的精神文明。\n强调物质文明建设和精神文明建设相辅相成、相互促进。\n强调精神文明重在建设。\n“一国两制”与祖国统一\n“一国两制”的基本内容\n坚持一个中国，这是“和平统一、一国两制”的核心，是发展两岸关系和实现和平统一的基础；\n两制并存，在祖国统一的前提下，国家的主体部分实行社会主义制度，同时在香港、澳门、台湾保持原有的社会制度和生活方式长期不变；\n高度自治，祖国完全统一后，香港、澳门、台湾作为中央政府全面管辖下的特别行政区，享有不同于中国其他省、市、自治区的高度自治权，台湾、香港、澳门同胞各种合法权益将得到切实尊重和维护；\n尽最大努力争取和平统一，但不承诺放弃使用武力；\n解决台湾问题，实现祖国完全统一，寄希望于台湾人民。\n邓小平创造性地提出“一个国家，两种制度”科学构想，开辟了以和平方式实现祖国统一的新途径。\n党的建设理论\n重视马克思主义理论学习是加强党的建设，从而增强我们工作中的原则性、系统性、预见性和创造性的必修课；\n加强组织建设是党的建设的重要环节。坚持和健全民主集中制、加强和改进党的基层组织建设、培养和选拔德才兼备的领导干部是组织建设的重要问题。\n加强领导班子建设，培养和选拔德才兼备的各级领导干部，是加强党的建设，保证党的路线的连续性和国家长治久安的根本大计。\n加强党的建设必须打好党风建设这场硬仗。\n加强党的建设一定要重视制度建设。\n除以上这些主要创新成果外，还有许多丰富和深刻的思想。如：在人民军队建设问题上，强调党领导的人民军队是社会主义祖国的保卫者和建设社会主义的重要力量，要坚持党对军队的绝对领导，要搞好部队的科学管理，提高正规化水平，等等。", "priority": 2, "priorityLabel": "综合备用", "priorityReason": "可用于党的建设、统一战线、综合题和理论体系题。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第六章重点：社会主义本质与共同富裕。", "inFinalScope": true}, {"id": "80c6489ffb80", "source": "23版课后思考题答案", "chapter": "第六章 邓小平理论", "prompt": "如何认识邓小平理论的历史地位？", "answer": "答：邓小平理论的历史地位主要体现为：\n马克思列宁主义、毛泽东思想的继承和发展。邓小平理论，是马克思列宁主义基本原理同当代中国实际和时代特征相结合的产物，是对马克思列宁主义、毛泽东思想的继承和发展，是全党全国人民集体智慧的结晶。解放思想、实事求是是邓小平理论的精髓。\n中国特色社会主义理论体系的开篇之作。邓小平作为中国特色社会主义理论的创立者，做出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策，科学回答了建设中国特色社会主义的一系列基本问题，为建设中国特色社会主义提供了根本遵循。\n为改革开放和社会主义现代化建设提供了科学指南。\n邓小平理论指导了改革开放的伟大实践。邓小平理论已经被实践证明是指导中国人民建设中国特色社会主义，保证中国在改革开放中实现国家繁荣富强和人民共同富裕的系统的科学理论。\n邓小平理论是中国共产党和中国人民宝贵的精神财富，是改革开放和社会主义现代化建设的科学指南，是党和国家必须长期坚持的指导思想。", "priority": 2, "priorityLabel": "综合备用", "priorityReason": "可用于党的建设、统一战线、综合题和理论体系题。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第六章重点：社会主义本质与共同富裕。", "inFinalScope": true}, {"id": "b8f269367b14", "source": "23版课后思考题答案", "chapter": "第七章 “三个代表”重要思想", "prompt": "怎样准确把握“三个代表”重要思想的核心观点？", "answer": "答：“中国共产党必须始终代表中国先进生产力的发展要求，代表中国先进文化的前进方向，代表中国最广大人民的根本利益。”这是对“三个代表”重要思想的集中概括。可以从以下几个方面把握“三个代表”重要思想的核心观点：\n始终代表中国先进生产力的发展要求\n实现社会主义现代化，最根本的就是要通过改革，不断促进先进生产力的发展，使我国形成发达的生产力。\n人是生产力中最活跃的因素，开发人力资源，加强人力资源能力建设，是关系我国发展的重大问题。必须树立人才资源是第一资源的思想，实施人才战略，加强人才队伍建设，为改革开放和现代化建设提供强大的人才保证。\n科技进步和创新是发展生产力的决定因素。\n促进先进生产力的发展，就要使生产关系和上层建筑的各个方面不断体现先进生产力的发展要求。\n始终代表中国先进文化的前进方向\n发展社会主义先进文化，就是建设社会主义精神文明。\n发展社会主义先进文化，就是发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化。\n发展社会主义先进文化，必须弘扬民族精神。在五千多年的发展中，中华民族形成了以爱国主义为核心的团结统一、爱好和平、勤劳勇敢、自强不息的伟大民族精神。\n发展社会主义先进文化，必须加强社会主义思想道德建设，这是发展先进文化的重要内容和中心环节。\n发展社会主义先进文化，必须做好思想政治工作。\n始终代表中国最广大人民的根本利益\n我们全部工作的出发点和落脚点，就是不断实现好、维护好、发展好最广大人民的根本利益。\n我们党始终坚持人民的利益高于一切。\n要努力使工人、农民、知识分子和其他群众共同享受到经济社会发展的成果。\n在我国社会深刻变革、党和国家事业快速发展的进程中，妥善处理各方面的利益关系，把一切积极因素充分调动和凝聚起来，至关紧要。\n人民，只有人民，才是我们工作价值的最高裁决者。党和国家的一切工作和方针政策，都要以是否符合最广大人民群众的根本利益为最高衡量标准。", "priority": 2, "priorityLabel": "综合备用", "priorityReason": "可用于党的建设、统一战线、综合题和理论体系题。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第七章重点：三个代表、市场经济体制或政治文明。", "inFinalScope": true}, {"id": "8a6b0b556611", "source": "23版课后思考题答案", "chapter": "第七章 “三个代表”重要思想", "prompt": "怎样全面把握“三个代表”重要思想的主要内容？", "answer": "答：可以从以下几个方面把握“三个代表”重要思想的主要内容：\n发展是党执政兴国的第一要务\n在我国这样一个发展中大国，能不能解决好发展问题，直接关系人心向背、事业兴衰。\n建立社会主义市场经济体制\n建立社会主义市场经济体制，必须坚持和完善公有制为主体、多种所有制经济共同发展的社会主义基本经济制度。\n发挥市场机制的作用和国家宏观调控，都是社会主义市场经济体制的内在要求。\n理顺分配关系，调整和规范国家、企业和个人的分配关系。坚持效率优先、兼顾公平，既要提倡奉献精神，又要落实分配政策，既要反对平均主义，又要防止收入悬殊。\n建立和完善社会保障体系，是建立社会主义市场经济体制的重要内容。\n全面建设小康社会\n江泽民在党的十五大报告中初步勾画了实现第三步战略目标的蓝图：21世纪第一个十年实现国民生产总值比2000年翻一番，使人民的小康生活更加宽裕，形成比较完善的社会主义市场经济体制；再经过十年的努力，到建党一百年时，使国民经济更加发展，各项制度更加完善；到21世纪中叶新中国成立一百年时，基本实现现代化，建成富强民主文明的社会主义国家。十五届五中全会进一步提出，从新世纪开始，我国将进入全面建设小康社会、加快推进社会主义现代化的新的发展阶段。\n建设社会主义政治文明\n在党的十六大报告中，江泽民把社会主义物质文明、政治文明、精神文明一起确立为社会主义现代化全面发展的三大基本目标，从而使中国特色社会主义的理论和实践进一步走向成熟和完善。建设社会主义民主政治，是社会主义现代化建设的重要目标。\n建设社会主义政治文明涉及政治思想、政治制度、行政管理、法制建设等方面，是一个系统工程。\n建设社会主义政治文明，必须发展社会主义民主。没有民主就没有射虎主义，就没有社会主义的现代化。\n建设社会主义政治文明，必须坚持和完善中国特色社会主义政治制度。坚持人民代表大会制度、中国共产党领导的多党合作和政治协商制度、民族区域自治制度，健全基层自治组织和民主管理制度。\n建设社会主义政治文明，必须坚持依法治国，建设社会主义法治国家。\n建设社会主义政治文明，必须进行政治体制改革。政治体制改革是社会主义政治制度的自我完善和发展。\n建设社会主义政治文明，必须推进决策的科学化民主化。\n建设社会主义政治文明，必须尊重和保障人权。\n实施、“引进来”和“走出去”相结合的对外开放战略\n加入世界贸易组织，是以江泽民同志为主要代表的中国共产党人面对经济全球化趋势加快，从我国经济发展和改革开放的需要出发，作出的重大战略决策，标志着我国对外开放进入了—个新的阶段。“引进来”和“走出去”，是我们对外开放方针的两个紧密联系、相互促进的方面，缺—不可。\n推进党的建设新的伟大工程\n坚持中国共产党的领导，就是要坚持党在建设中国特色社会主义事业中的领导核心地位，发挥党总揽全局、协调各方的作用。\n坚持党的领导，核心是坚持党的先进性。\n推进党的建设新的伟大工程，重点是加强党的执政能力建设，不断提高科学判断形势的能力、驾驭市场经济的能力、应对复杂局面的能力、依法执政的能力、总揽全局的能力。\n坚持用马克思主义武装全党。党在思想理论上的提高是党和国家事业不断发展的思想保证。\n把党的最低纲领和最高纲领统一起来。坚信马克思主义关于人类社会必然走向共产主义这一基本原理。\n领导干部一定要讲学习、讲政治、讲正气。讲学习是前提。要坚持学习、学习、再学习，实践、实践、再实践。讲政治是核心。\n坚持党要管党、从严治党的方针。江泽民指出：“治国必先治党，治党务必从严”。\n坚决反对和防止腐败是全党一项重大的政治任务，是关系党和国家生死存亡的严重政治斗争。\n“三个代表”重要思想是一个完整的科学体系，除了上面的主要内容以外，还包括关于大力弘扬与时俱进的精神；社会主义初级阶段的基本纲领；中国特色社会主义改革开放的理论；建立巩固的国防、加强军队的革命化现代化正规化建设的思想；坚持和发展爱国统一战线理论；中国特色社会主义外交和国际战略；推进祖国完全统一，提出发展两岸关系八项主张的理论等。", "priority": 2, "priorityLabel": "综合备用", "priorityReason": "可用于党的建设、统一战线、综合题和理论体系题。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第七章重点：三个代表、市场经济体制或政治文明。", "inFinalScope": true}, {"id": "dfa8998e6212", "source": "23版课后思考题答案", "chapter": "第七章 “三个代表”重要思想", "prompt": "如何理解“三个代表”重要思想的历史地位？", "answer": "答：“三个代表”重要思想在形成和发展的过程中，紧密结合新的实践，把治党和治国、执政和为民结合起来，创造性地运用马克思列宁主义、毛泽东思想、邓小平理论在改革发展稳定、内政外交国防、治党治国治军各个方面，提出了一系列紧密联系、相互贯通的新思想、新观点、新论断。\n始终做到“三个代表”，是我们党的立党之本、执政之基、力量之源。“三个代表”重要思想的历史地位体现在：\n它是中国特色社会主义理论体系的丰富发展。\n“三个代表”重要思想继承、丰富和发展了马克思列宁主义、毛泽东思想、邓小平理论，深化了我们对新的时代条件下推进中国特色社会主义事业、加强党的建设的规律的认识。\n“三个代表”重要思想坚持把人民的根本利益作为出发点和归宿，提出“最大多数人的利益是最紧要和最具有决定性的因素”，时刻要把人民群众的安危冷暖放在心上，关心群众疾苦，努力为群众办好事、办实事。\n“三个代表”重要思想强调社会主义社会是全面发展、全面进步的社会，揭示了中国特色社会主义是社会主义物质文明、政治文明和精神文明的有机统一，体现了社会主义现代化建设的全面性、系统性，体现了经济、政治、文化全面协调发展的客观要求，加深了对建设中国特色社会主义经济、政治、文化的规律性认识。\n“三个代表”重要思想强调要努力促进人的全面发展，阐明了社会主义经济、文化发展与人的全面发展的辩证关系，即推进人的全面发展，同推进经济、文化的发展和改善人民物质文化生活，是互为前提和基础的，丰富发展了马克思主义关于人的全面发展是建设社会主义新社会本质要求的思想。\n“三个代表”重要思想科学地揭示了执政党建设的规律，赋予了党的指导思想、宗旨和任务以鲜明的时代内容和时代特征，形成了崭新的马克思主义建党学说。\n它是加强和改进党的建设，推进中国特色社会主义事业的强大理论武器。\n“三个代表”重要思想把发展先进生产力、发展先进文化和实现最广大人民的根本利益统一起来，从深层次上揭示了社会主义制度不断完善和发展的途径。\n“三个代表”重要思想提出了党的建设的新要求：\n必须使全党始终保持与时俱进的精神状态，不断开拓马克思主义理论发展的新境界。\n必须把发展作为党执政兴国的第一要务，不断开创现代化建设的新局面。\n必须最广泛最充分地调动一切积极因素，不断为中华民族伟大复兴增添新力量。\n必须以改革的精神推进党的建设，不断为党的肌体注入新活力。\n“三个代表”重要思想从新的高度提出必须不断改进党的领导方式和执政方式，为改进党的领导方式和执政方式提供了基本遵循。\n总之，“三个代表”重要思想不仅在邓小平理论的基础上，进一步回答了什么是社会主义、怎样建设社会主义的问题，创造性地回答了建设什么样的党、怎样建设党的问题，集中起来深化了对中国特色社会主义的认识，而且反映了当代世界和中国的发展变化对党和国家工作的新要求，是加强和改进党的建设、推进我国社会主义自我完善和发展的强大理论武器，是党和国家必须长期坚持的指导思想。", "priority": 4, "priorityLabel": "常规覆盖", "priorityReason": "作为章节完整覆盖内容保留。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第七章重点：三个代表、市场经济体制或政治文明。", "inFinalScope": true}, {"id": "354ba933fcf2", "source": "23版课后思考题答案", "chapter": "第八章 科学发展观", "prompt": "如何理解科学发展观的科学内涵？", "answer": "答：可以从以下几个方面把握科学发展观的科学内涵和精神实质：\n第一要义：推动经济社会发展是科学发展观的第一要义。在当代中国，坚持发展是硬道理的本质要求就是坚持科学发展观。\n必须加快转变经济发展方式。\n必须推动科学技术的跨越式发展。\n必须培养高素质创新型人才。\n必须善于抓住和用好机遇。\n核心立场：以人为本是科学发展观的核心立场。集中体现了马克思主义的基本原理，体现了党全心全意为人民服务的根本宗旨和推动经济社会发展的根本目的，是社会主义的本质特征。\n坚持发展为了人民，始终把最广大人民的根本利益放在第一位。\n坚持发展依靠人民，从人民群众的伟大创造中汲取智慧和力量。\n坚持发展成果由人民共享，着力提高人民物质文化生活水平。\n最终是为了实现人的全面发展。\n基本要求：全面协调可持续是科学发展观的基本要求。“全面”是指发展要有全面性、整体性，不仅经济要发展，而且各个方面都要发展；“协调”是指发展要有协调性、均衡性，各个方面、各个环节的发展要相互适应、相互促进。“可持续”是指发展要有持久性、连续性，不仅当前要发展，而且要保证长远发展。\n坚持全面发展，要按照中国特色社会主义事业总体布局，正确认识和把握经济建设、政治建设、文化建设、社会建设、生态文明建设是相互联系、相互促进的有机统一体。\n坚持协调发展，要保证中国特色社会主义各个领域协调推进。\n坚持可持续发展，坚定走生产发展、生活富裕、生态良好的文明发展道路。\n坚持可持续发展，必须建设生态文明\n根本方法：统筹兼顾是科学发展观的根本方法。深刻体现了唯物辩证法在发展问题上的科学运用，深刻揭示了实现科学发展、促进社会和谐的基本途径，是正确处理经济社会发展中重大关系的方针原则。\n必须正确认识和妥善处理中国特色社会主义事业中的重大关系。\n必须认真考虑和对待各方面的发展需要，正确反映和兼顾各阶层各群体的利益要求。\n要牢牢掌握统筹兼顾的科学思想方法，努力提高战略思维、创新思维、辩证思维能力，不断增强统筹兼顾的本领，更好地推动科学发展。\n要求既立足当前，又着眼长远，做到兼顾各方、综合平衡。", "priority": 3, "priorityLabel": "客观概念为主", "priorityReason": "情报提示科学发展观主要考概念型客观题，大题低配掌握即可。", "lastClassPriority": 5, "lastClassPriorityLabel": "保险低优先级", "lastClassReason": "第八章不作为主攻大题，但科学发展观概念可作保险材料。", "inFinalScope": true}, {"id": "679a1b283faf", "source": "23版课后思考题答案", "chapter": "第八章 科学发展观", "prompt": "如何把握科学发展观的主要内容？", "answer": "答：可以从以下几个方面把握科学发展观的主要内容：\n加快转变经济发展方式\n推动经济持续健康发展，必须坚持以科学发展为主题，以加快转变经济发展方式为主线。\n全面深化经济体制改革是加快转变经济发展方式的关键。\n实施创新驱动发展战略，是转变经济发展方式的重大战略决策。\n推动经济结构战略性调整，是提升国民经济整体素质、赢得国际经济竞争主动权的根本途径，是加快转变经济发展方式的主攻方向。\n促进区域协调发展是我国现代化建设中的一个重大战略。\n积极稳妥推进城镇化是优化城乡经济结构、促进国民经济良性循环和社会协调发展的重要措施。\n推动城乡发展一体化，是解决“三农”问题的根本途径。\n实现工业化、信息化、城镇化、农业现代化，是我国社会主义现代化建设的战略任务，也是加快形成新的经济发展方式、促进经济持续健康发展的重要动力\n发展社会主义民主政治\n社会主义民主政治的本质和核心是人民当家作主。\n发展社会主义民主政治，必须坚定不移地走中国特色社会主义政治发展道路，坚持党的领导、人民当家作主、依法治国有机统一。\n坚持和完善社会主义政治制度。发展社会主义民主政治，最重要的就是要坚持好、发展好适合我国国情的社会主义政治制度。这些制度集中体现了我国社会主义民主政治的特点和优势，必须始终不渝地坚持、发展和完善。\n健全社会主义协商民主制度。社会主义协商民主是我国民主的重要形式，是中国共产党和中国人民在社会主义民主形式方面的伟大创造，是对马克思主义民主理论的丰富和发展，充分体现了社会主义民主的真实性、广泛性、包容性。\n坚定不移推进依法治国基本方略，这是国家长治久安的重要保障。依法治国从制度上、法律上保证人民当家作主，保证党的执政地位。\n积极稳妥推进政治体制改革。政治体制改革是社会主义政治制度的自我完善和发展。推进政治体制改革，必须坚持正确政治方向，要充分发挥我国社会主义政治制度优越性。\n巩固和发展最广泛的爱国统一战线。统一战线是夺取中国特色社会主义新胜利的重要法宝。\n推进社会主义文化强国建设\n推进社会主义文化强国的建设要做到：\n要树立高度的文化自觉和文化自信，提高国家文化软实力，加快建设与我国深厚文化底蕴和丰富文化资源相匹配、与中国特色社会主义事业总体布局相适应、与建设富强民主文明和谐的社会主义现代化国家的目标相承接的社会主义文化强国。\n要坚定不移走中国特色社会主义文化发展道路，坚持为人民服务、为社会主义服务的方向，坚持百花齐放、百家争鸣的方针，坚持贴近实际、贴近生活、贴近群众的原则，推动社会主义精神文明和物质文明全面发展，建设面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化。\n建设社会主义核心价值体系。社会主义核心价值体系是兴国之魂，决定着中国特色社会主义文化发展方向。马克思主义指导思想、中国特色社会主义共同理想、以爱国主义为核心的民族精神和以改革创新为核心的时代精神，社会主义荣辱观，共同构成社会主义核心价值体系的基本内容。\n要坚持不懈用中国特色社会主义理论体系武装全党、教育人民。广泛开展理想信念教育；大力弘扬民族精神和时代精神；加强社会公德、职业道德、家庭美德、个人品德教育；加强和改进思想政治工作：倡导富强，民主、文明、和谐，倡导自由、平等、公正、法治，倡导爱国、敬业、诚信、友善，积极培育和践行社会主义核心价值观\n加强新闻宣传工作。新闻舆论处在意识形态领域的前沿，对社会精神生活和人们思想意识有着重大影响。舆论引导正确，利党利国利民；舆论引导错误，误党误国误民。\n繁荣文艺创作。文艺是民族精神的火炬，是提高人民精神境界、培育人民高尚灵魂的重要力量。\n构建社会主义和谐社会\n构建社会主义和谐社会的总要求是民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处。这几个方面相互联系、相互作用。\n民主法治。即社会主义民主得到充分发扬，依法治国基本方略得到切实落实，各方面积极因素得到广泛调动。\n公平正义。即社会各方面的利益关系得到妥善协调，人民内部矛盾和其他社会矛盾得到正确处理，社会公平和正义得到切实维护和实现。\n诚信友爱。即全社会互帮互助、诚实守信，全体人民平等友爱、融洽相处。\n充满活力。即能够使一切有利于社会进步的创造愿望得到尊重，创造活动得到支持，创造才能得到发挥，创造成果得到肯定。\n安定有序。即社会组织机制健全，社会管理完善，社会秩序良好，人民群众安居乐业，社会保持安定团结。\n人与自然和谐相处。指生产发展，生活富裕，生态良好。\n在构建社会主义和谐社会的实际工作中，既要从“大社会”着眼，把和谐社会建设落实到包括经济建设、政治建设、文化建设、社会建设和党的建设等在内的党和国家全部工作之中，又要从“小社会”着手，以解决人民群众最关心最直接最现实的利益问题为重点，着力发展社会事业、促进社会公平正义、建设和谐文化、完善社会管理、增强社会创造活力，走共同富裕道路，推动社会建设与经济建设、政治建设、文化建设、协调发展\n保障和改善民生。做好保障和改善民生工作，是坚持以人为本、实现发展成果由人民共享的必然要求。要做到：a．优先发展教育；b．积极扩大就业；c．合理收入分配；d．完善社会保障。\n加强和创新社会管理。这是构建社会主义和谐社会的必然要求。\n推进生态文明建设\n建设生态文明，是关系人民福祉、关乎民族未来的长远大计。建设生态文明，实质上就是要建设以资源环境承载力为基础、以自然规律为准则、以可持续发展为目标的资源节约型、环境友好型社会。\n推动形成人与自然和谐发展现代化建设新格局，是保持经济平稳较快发展、提高人民生活质量、促进社会和谐稳定的必然要求。\n珍惜每一寸国土。国土是生态文明建设的空间载体。\n全面促进资源节约。资源只有节约才能持久利用。\n加大生态环境保护力度。良好生态环境是人和社会持续发展的根本基础。\n加快建立生态文明制度。生态文明建设是涉及生产方式和生活方式根本性变革的战略任务，实现这样的根本性变革，必须依靠制度。\n全面提高党的建设科学化水平\n党的建设是党领导伟大事业取得胜利的重要法宝，形势的发展、事业的开拓、人民的期待，都要求全面推进党的建设的新的伟大工程。\n新形势下全面提高党的建设科学化水平的总要求：\n要增强紧迫感和责任感，牢牢把握加强党的执政能力建设、先进性和纯洁性建设这条主线。\n坚持解放思想、改革创新，坚持党要管党、从严治党，全面加强党的思想建设、组织建设、作风建设、反腐倡廉建设、制度建设。\n增强自我净化、自我完善、自我革新、自我提高能力，建设学习型、服务型、创新型的马克思主义执政党，确保党始终成为中国特色社会主义事业的坚强领导核心。\n执政能力建设是党执政后的一项根本建设。党的执政能力，就是党提出和运用正确的理论、路线、方针、政策和策略，领导制定和实施宪法和法律，采取科学的领导制度和领导方式，动员和组织人民依法管理国家和社会事务、经济和文化事业，有效治党治国治军，建设社会主义现代化国家的本领。\n保持和发展党的先进性是马克思主义政党自身建设的根本任务和永恒课题。党的纯洁性同先进性是一致的，纯洁性是先进性的重要体现。\n党的优良作风是党始终立于不败之地的重要保证。以人为本、执政为民是检验党一切执政活动的最高标准。\n此外，以胡锦涛同志为主要代表的中国共产党人还在推进全面深化改革，推动国防和军队建设科学发展，坚持“一国两制”、推进祖国统一，推动建设持久和平、共同繁荣的和谐世界方面提出了一系列新观点新论断，这些重要思想是科学发展观的重要组成部分，是科学发展观在内政外交国防、治党治国治军等领域的运用和展开，进一步丰富和发展了中国特色社会主义理论体系。", "priority": 3, "priorityLabel": "客观概念为主", "priorityReason": "情报提示科学发展观主要考概念型客观题，大题低配掌握即可。", "lastClassPriority": 5, "lastClassPriorityLabel": "保险低优先级", "lastClassReason": "第八章不作为主攻大题，但科学发展观概念可作保险材料。", "inFinalScope": true}, {"id": "c26fe29967e0", "source": "23版课后思考题答案", "chapter": "第八章 科学发展观", "prompt": "如何理解科学发展观的历史地位？", "answer": "答：科学发展观的历史地位主要表现为：\n中国特色社会主义理论体系在新世纪新阶段的接续发展\n科学发展观是我们党坚持把马克思主义基本原理同当代中国实际和时代特征相结合，继续拓展中国特色社会主义实践、探索中国特色社会主义规律的理论成果。\n科学发展观是对经济社会发展一般规律认识的深化，是马克思主义关于发展的世界观和方法论的集中体现，是中国特色社会主义理论体系的重要组成部分。\n科学发展观最鲜明的精神实质是解放思想、实事求是、与时俱进、求真务实，充分体现了马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想和科学发展观的历史逻辑和内在联系。科学发展观初步形成了马克思主义关于社会主义发展的系统理论，进一步丰富和深化了马克思主义对发展问题的认识。\n科学发展观在邓小平理论和“三个代表”重要思想的基础上，进一步回答了什么是社会主义、怎样建设社会主义和建设什么样的党、怎样建设党的问题，创造性地回答了新形势下实现什么样的发展、怎样发展等重大问题，形成了涵盖改革发展稳定、内政外交国防、治党治国治军各方面的系统科学理论，实现了党在指导思想上又一次与时俱进，开辟了当代中国马克思主义发展新境界。\n全面建设小康社会、加快推进社会主义现代化的根本指针\n科学发展观不仅是指导经济建设的理论，而且是指导各方面建设的理论；不仅是指导发展的理论，而且是指导党和国家全部工作的理论；不仅是指导实践、推动工作的有力武器，而且是帮助人们认识和把握社会发展规律的世界观和方法论。\n科学发展观涉及生产力和生产关系、经济基础和上层建筑的各个环节，贯通中国特色社会主义伟大事业和党的建设新的伟大工程的各个方面，进一步深化了对共产党执政规律、社会主义建设规律和人类社会发展规律的认识，是党执政理念的丰富和发展，是全面建设小康社会、加快推进社会主义现代化的根本指针。", "priority": 3, "priorityLabel": "客观概念为主", "priorityReason": "情报提示科学发展观主要考概念型客观题，大题低配掌握即可。", "lastClassPriority": 5, "lastClassPriorityLabel": "保险低优先级", "lastClassReason": "第八章不作为主攻大题，但科学发展观概念可作保险材料。", "inFinalScope": true}, {"id": "9dc442487463", "source": "考前情报补充大题模板", "chapter": "第二章 新民主主义革命理论", "prompt": "为什么说统一战线是中国革命、建设和改革的重要法宝？", "answer": "答题骨架：\n1. 统一战线是中国共产党在中国革命中战胜敌人的三大法宝之一，同武装斗争、党的建设相互联系。\n2. 新民主主义革命时期，中国社会矛盾复杂，革命对象强大，革命动力包括工人、农民、城市小资产阶级和民族资产阶级。党必须团结一切可以团结的力量，形成最广泛的革命统一战线。\n3. 统一战线必须坚持无产阶级及其政党的领导权，正确处理同资产阶级既联合又斗争的关系，坚持独立自主原则。\n4. 社会主义建设和改革开放时期，统一战线继续服务于团结各方面力量、调动一切积极因素、推进社会主义现代化和中华民族伟大复兴。\n5. 结合本课程看，毛泽东思想强调统一战线是三大法宝；邓小平理论强调改革开放和现代化需要广泛团结；“三个代表”重要思想强调代表最广大人民根本利益；科学发展观强调以人为本和统筹兼顾。统一战线贯穿中国革命、建设、改革全过程。\n结尾：统一战线的实质，是在党的领导下凝聚共同目标、汇聚最大合力。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "同学情报明确点名统一战线可能成为贯穿始终的综合大题。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第二章重点：革命道路与三大法宝。", "inFinalScope": true}, {"id": "e09e45726f3e", "source": "考前情报补充大题模板", "chapter": "第二章 新民主主义革命理论", "prompt": "如何结合《新民主主义论》理解新民主主义革命理论的主要内容？", "answer": "答题骨架：\n1. 《新民主主义论》系统阐述了新民主主义革命理论，回答了半殖民地半封建中国进行什么革命、由谁领导、依靠谁、反对谁、前途是什么等问题。\n2. 革命总路线是无产阶级领导的、人民大众的、反对帝国主义、封建主义和官僚资本主义的革命。\n3. 革命动力包括工人阶级、农民阶级、城市小资产阶级和民族资产阶级，其中农民是主力军；领导力量是无产阶级及其政党。\n4. 新民主主义基本纲领包括政治、经济、文化纲领，体现了新民主主义社会的过渡性质。\n5. 革命道路是农村包围城市、武装夺取政权；三大法宝是统一战线、武装斗争、党的建设。\n6. 新民主主义革命不是旧式资产阶级民主革命，而是由无产阶级领导、以社会主义为前途的新式民主革命。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增情报明确要求重点关注《新民主主义论》。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第二章重点：革命道路与三大法宝。", "inFinalScope": true}, {"id": "acf22a7d4626", "source": "考前情报补充大题模板", "chapter": "第三章 社会主义改造理论", "prompt": "如何理解 1953-1956 年社会主义制度建设的主线和意义？", "answer": "答题骨架：\n1. 1953-1956 年的主线是党在过渡时期总路线指导下推进社会主义工业化和社会主义改造，即“一化三改”。\n2. “一化”是逐步实现国家社会主义工业化；“三改”是对农业、手工业和资本主义工商业进行社会主义改造。\n3. 农业和手工业走合作化道路；资本主义工商业通过国家资本主义形式实行和平赎买。\n4. 社会主义改造的基本经验包括：坚持社会主义工业化和社会主义改造同时并举；采取积极引导、逐步过渡方式；用和平方法改造资本主义工商业。\n5. 到 1956 年，社会主义改造基本完成，社会主义基本制度在我国确立，实现了中国历史上最深刻最伟大的社会变革，为当代中国一切发展进步奠定了制度基础。", "priority": 1, "priorityLabel": "高优先级", "priorityReason": "新增情报明确点名 1953-1956 社会主义制度建设。", "lastClassPriority": 1, "lastClassPriorityLabel": "最后一课最高优先级", "lastClassReason": "第三章核心板块：过渡时期总路线、一化三改。", "inFinalScope": true}, {"id": "41f3a7a53ae9", "source": "考前情报补充大题模板", "chapter": "第四章 社会主义建设道路初步探索", "prompt": "《论十大关系》的主要意义是什么？它对社会主义建设道路初步探索有什么启示？", "answer": "答题骨架：\n1. 《论十大关系》是在社会主义改造基本完成前后，党开始探索适合中国国情的社会主义建设道路的重要成果。\n2. 它以苏联经验为鉴戒，提出要正确处理重工业和轻工业、农业，沿海工业和内地工业，经济建设和国防建设，国家、生产单位 function metric(n,l){return '<div class="card"><div class="metric"><div class="n">'+esc(n)+'</div><div class="l">'+esc(l)+'</div></div></div>'}
function home(){setHead('总览','先看知识点，再刷单选，最后练大题');var answered=keys(state.answered).length,correct=0;for(var k in state.answered){if(state.answered[k].correct)correct++}var h='<div class="cards">'+metric(DATA.stats.finalScopeSingleCount||DATA.stats.singleCount,'期末范围单选')+metric(DATA.stats.lastClassHighPrioritySingleCount||0,'高优先级单选')+metric(keys(state.read).length+'/'+DATA.knowledge.length,'知识点进度')+metric(pct(correct,answered)+'%','刷题正确率')+'</div><div class="clear"></div>';h+='<div class="two"><div class="half"><div class="panel"><h2>今日路径</h2><p><button class="primary" data-go="knowledge">知识点</button> <button class="blue" data-go="quiz">单选刷题</button> <button data-go="essay">大题训练</button></p><ul><li>默认抽导论、1-4章、6-7章，并保留第八章科学发展观保险低优先级单选。</li><li>第五章不考；第八章不主攻，但科学发展观概念题保留；多选题仅作补充。</li><li>简答和论述按老师最后强调的得分点优先练。</li></ul></div></div><div class="half"><div class="panel"><h2>资料覆盖</h2><div class="note">';for(var i=0;i<DATA.resources.length;i++){var r=DATA.resources[i];h+=esc(r.name)+' · '+esc(r.type)+' · '+Math.round(r.size/1024)+'KB\\n'}h+='</div></div></div></div><div class="clear"></div><div class="panel"><h2>章节掌握</h2>'+progressRows()+'</div>';$('app').innerHTML=h;var bs=$('app').getElementsByTagName('button');for(var j=0;j<bs.length;j++){if(bs[j].getAttribute('data-go'))bs[j].onclick=function(){view=this.getAttribute('data-go');render()}}}
function knowledge(){setHead('知识点','覆盖客观题与大题可能考到的核心概念');var item=DATA.knowledge[0];for(var i=0;i<DATA.knowledge.length;i++){if(DATA.knowledge[i].chapter===chapter)item=DATA.knowledge[i]}var h='<div class="two"><div class="half"><div class="panel chapter-buttons">';for(i=0;i<DATA.knowledge.length;i++){var ch=DATA.knowledge[i].chapter,cls=(ch===item.chapter?'on':'');if(EXAM_CHAPTERS.indexOf(ch)<0)cls+=' low';h+='<button data-ch="'+esc(ch)+'" class="'+cls+'">'+esc(shortName(ch))+(EXAM_CHAPTERS.indexOf(ch)<0?'（低）':'')+'</button>'}h+='</div></div><div class="half"><div class="panel"><span class="tag">'+esc(item.weight)+'</span><span class="tag">'+(state.read[item.chapter]?'已读':'未读')+'</span><h2>'+esc(item.chapter)+'</h2><h3>必背知识</h3><ul>';for(i=0;i<item.must.length;i++)h+='<li>'+esc(item.must[i])+'</li>';h+='</ul><h3>易混点</h3><ul>';for(i=0;i<item.traps.length;i++)h+='<li>'+esc(item.traps[i])+'</li>';h+='</ul><h3>大题骨架</h3><div class="callout">'+esc(item.essay)+'</div><h3>记忆钩子</h3><div class="callout">'+esc(item.memory)+'</div><p><button class="primary" id="readBtn">'+(state.read[item.chapter]?'取消已读':'标记已读')+'</button> <button id="brushBtn">刷本章单选</button></p></div></div></div><div class="clear"></div>';$('app').innerHTML=h;var bs=$('app').getElementsByTagName('button');for(i=0;i<bs.length;i++){if(bs[i].getAttribute('data-ch'))bs[i].onclick=function(){chapter=this.getAttribute('data-ch');knowledge()}}$('readBtn').onclick=function(){if(state.read[item.chapter])delete state.read[item.chapter];else state.read[item.chapter]=true;save();knowledge()};$('brushBtn').onclick=function(){view='quiz';render();chapter=item.chapter;$('quizChapter').value=chapter;startQuiz()}}
function quizHome(){setHead('单选刷题','按最后一节课重点重排；第八章作保险低优先级；多选已降为补充理解');var h='<div class="panel tip"><b>最后一课口径：</b>'+esc(DATA.examIntel?DATA.examIntel.summary:'按期末范围刷题')+'</div><div class="panel toolbar"><label>章节<select id="quizChapter"><option>全部章节</option>';for(var i=0;i<DATA.chapters.length;i++)h+='<option'+(DATA.chapters[i]===chapter?' selected':'')+'>'+esc(DATA.chapters[i])+'</option>';h+='</select></label><label>题库<select id="quizType"><option value="final">期末范围单选</option><option value="high">最后一课高优先级</option><option value="single">全部单选</option><option value="exam">旧版考试主库单选</option><option value="multi">补充多选（本次不考）</option><option value="all">全部客观题</option></select></label><label>模式<select id="quizMode"><option value="priority">高优先级优先</option><option value="weak">先刷未做和错题</option><option value="order">顺序</option><option value="random">随机</option><option value="wrong">错题</option><option value="fav">收藏</option></select></label><label>数量<select id="quizLimit"><option value="20">20题</option><option value="50" selected>50题</option><option value="100">100题</option><option value="all">全部</option></select></label><p><button class="primary" id="startBtn">开始</button></p></div><div id="quizBox"></div>';$('app').innerHTML=h;$('startBtn').onclick=startQuiz;if(quiz.list.length)showQ()}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=b[i];b[i]=b[j];b[j]=t}return b}
function startQuiz(){chapter=$('quizChapter').value;var type=$('quizType').value,mode=$('quizMode').value,limit=$('quizLimit').value,list=questions(chapter,type);if(mode==='wrong'){var w=[];for(var i=0;i<list.length;i++)if(state.wrong[list[i].id])w.push(list[i]);list=w}if(mode==='fav'){var f=[];for(i=0;i<list.length;i++)if(state.fav[list[i].id])f.push(list[i]);list=f}if(mode==='priority')list=list.slice().sort(function(a,b){return (a.lastClassPriority||a.examPriority||9)-(b.lastClassPriority||b.examPriority||9)});if(mode==='weak')list=list.slice().sort(function(a,b){var aw=state.wrong[a.id]?0:(state.answered[a.id]?2:1),bw=state.wrong[b.id]?0:(state.answered[b.id]?2:1);return aw-bw||((a.lastClassPriority||9)-(b.lastClassPriority||9))});if(mode==='random')list=shuffle(list);if(limit!=='all')list=list.slice(0,parseInt(limit,10));quiz={list:list,idx:0,sel:{},checked:false};showQ()}
function selKeys(){var a=[];for(var k in quiz.sel)if(quiz.sel[k])a.push(k);a.sort();return a.join('')}
function showQ(){var box=$('quizBox');if(!quiz.list.length){box.innerHTML='<div class="panel">当前筛选没有题目</div>';return}var q=quiz.list[quiz.idx],h='<div class="panel"><span class="tag">'+(quiz.idx+1)+'/'+quiz.list.length+'</span><span class="tag">'+(q.type==='single'?'单选':'多选')+'</span><span class="tag">'+esc(shortName(q.chapter))+'</span><span class="tag">'+esc(q.source)+'</span><span class="tag">'+esc(q.lastClassPriorityLabel||q.examPriorityLabel||'常规覆盖')+'</span>'+(q.lastClassReason?'<span class="tag">'+esc(q.lastClassReason)+'</span>':'')+'<div class="qtitle">'+esc(q.prompt)+'</div>';for(var i=0;i<q.options.length;i++){var o=q.options[i],cls='option';if(quiz.sel[o.key])cls+=' sel';if(quiz.checked&&q.answer.indexOf(o.key)>=0)cls+=' ok';if(quiz.checked&&quiz.sel[o.key]&&q.answer.indexOf(o.key)<0)cls+=' no';h+='<button class="'+cls+'" data-k="'+esc(o.key)+'"><b>'+esc(o.key)+'</b>'+esc(o.text)+'</button>'}if(quiz.checked){var choice=selKeys(),ok=choice===q.answer;h+='<div class="result '+(ok?'good':'bad')+'">'+(ok?'正确':'错误')+'。你的答案：'+esc(choice)+'；正确答案：'+esc(q.answer)+'。</div>'}h+='<p><button class="primary" id="checkBtn">提交</button> <button id="nextBtn">下一题</button> <button id="favBtn">'+(state.fav[q.id]?'取消收藏':'收藏')+'</button></p></div>';box.innerHTML=h;var bs=box.getElementsByTagName('button');for(i=0;i<bs.length;i++){if(bs[i].getAttribute('data-k'))bs[i].onclick=function(){pick(this.getAttribute('data-k'))}}$('checkBtn').onclick=check;$('nextBtn').onclick=function(){quiz.idx=(quiz.idx+1)%quiz.list.length;quiz.sel={};quiz.checked=false;showQ()};$('favBtn').onclick=function(){if(state.fav[q.id])delete state.fav[q.id];else state.fav[q.id]=true;save();showQ()}}
function pick(k){var q=quiz.list[quiz.idx];if(q.type==='single')quiz.sel={};quiz.sel[k]=!quiz.sel[k];quiz.checked=false;showQ()}
function check(){var q=quiz.list[quiz.idx],choice=selKeys();if(!choice)return;var ok=choice===q.answer;quiz.checked=true;state.answered[q.id]={correct:ok,choice:choice,chapter:q.chapter,at:(new Date()).toISOString()};if(ok)delete state.wrong[q.id];else state.wrong[q.id]=true;save();showQ()}
function essayRank(e){return e.lastClassPriority||e.priority||4}function essays(){setHead('大题训练','先自己写提纲，再展开参考答案；默认高优先级在前');var chs=[],i;for(i=0;i<DATA.essays.length;i++)if(!has(chs,DATA.essays[i].chapter))chs.push(DATA.essays[i].chapter);var list=DATA.essays.slice().sort(function(a,b){return essayRank(a)-essayRank(b)});var h='<div class="panel"><div class="tip"><b>考前情报：</b>'+(DATA.examIntel?esc(DATA.examIntel.summary):'高优先级大题已置顶')+'</div><label>章节<select id="essayChapter"><option value="__priority__">高优先级优先</option>';for(i=0;i<chs.length;i++)h+='<option value="'+esc(chs[i])+'"'+(chs[i]===essayChapter?' selected':'')+'>'+esc(chs[i])+'</option>';h+='</select></label></div>';for(i=0;i<list.length;i++){var e=list[i];if(essayChapter&&essayChapter!=='__priority__'&&e.chapter!==essayChapter)continue;h+='<div class="panel"><span class="tag">'+esc(e.lastClassPriorityLabel||e.priorityLabel||'常规覆盖')+'</span><span class="tag">'+esc(shortName(e.chapter))+'</span><span class="tag">'+(state.essay[e.id]&&state.essay[e.id].mastered?'已掌握':'未掌握')+'</span><div class="qtitle">'+esc(e.prompt)+'</div>'+((e.lastClassReason||e.priorityReason)?'<div class="callout"><b>为什么优先：</b>'+esc(e.lastClassReason||e.priorityReason)+'</div>':'')+'<textarea data-note="'+esc(e.id)+'" placeholder="先自己写提纲，再展开参考答案">'+esc(state.notes[e.id]||'')+'</textarea><p><button data-show="'+esc(e.id)+'" class="primary">展开参考答案</button> <button data-master="'+esc(e.id)+'">'+(state.essay[e.id]&&state.essay[e.id].mastered?'取消掌握':'标记掌握')+'</button></p><div id="ans-'+esc(e.id)+'" class="essay-answer hide">'+esc(e.answer)+'</div></div>'}$('app').innerHTML=h;$('essayChapter').value=essayChapter||'__priority__';$('essayChapter').onchange=function(){essayChapter=this.value;essays()};var bs=$('app').getElementsByTagName('button');for(i=0;i<bs.length;i++){if(bs[i].getAttribute('data-show'))bs[i].onclick=function(){var el=$('ans-'+this.getAttribute('data-show'));el.className=el.className.indexOf('hide')>=0?'essay-answer':'essay-answer hide'};if(bs[i].getAttribute('data-master'))bs[i].onclick=function(){var id=this.getAttribute('data-master');state.essay[id]={mastered:!(state.essay[id]&&state.essay[id].mastered)};save();essays()}}var ts=$('app').getElementsByTagName('textarea');for(i=0;i<ts.length;i++)ts[i].oninput=function(){state.notes[this.getAttribute('data-note')]=this.value;save()}}
function wrong(){setHead('错题收藏','错题自动进入，收藏手动加入');var h='<div class="two"><div class="half"><div class="panel"><h2>错题</h2>'+qlist('wrong')+'</div></div><div class="half"><div class="panel"><h2>收藏</h2>'+qlist('fav')+'</div></div></div><div class="clear"></div>';$('app').innerHTML=h}
function qlist(kind){var h='',n=0;for(var i=0;i<DATA.questions.length;i++){var q=DATA.questions[i];if((kind==='wrong'&&state.wrong[q.id])||(kind==='fav'&&state.fav[q.id])){n++;h+='<div class="panel"><span class="tag">'+esc(shortName(q.chapter))+'</span><span class="tag">'+esc(q.answer)+'</span><br>'+esc(q.prompt)+'</div>'}}return h||'<p class="sub">暂无</p>'}
function progress(){setHead('进度','本机浏览器自动保存');var answered=keys(state.answered).length,correct=0;for(var k in state.answered)if(state.answered[k].correct)correct++;$('app').innerHTML='<div class="cards">'+metric(answered,'已刷题')+metric(pct(correct,answered)+'%','正确率')+metric(keys(state.wrong).length,'错题')+metric(keys(state.fav).length,'收藏')+'</div><div class="clear"></div><div class="panel"><h2>章节进度</h2>'+progressRows()+'</div><div class="panel"><h2>数据管理</h2><button class="danger" id="resetPageBtn">重置进度</button></div>';$('resetPageBtn').onclick=openReset}
function progressRows(){var h='';for(var i=0;i<DATA.chapters.length;i++){var ch=DATA.chapters[i],qs=questions(ch,'final'),done=0;for(var j=0;j<qs.length;j++)if(state.answered[qs[j].id])done++;var p=pct(done,qs.length);h+='<div class="barrow"><div class="barlabel">'+esc(shortName(ch))+'</div><div class="barbox"><span style="width:'+p+'%"></span></div><div class="bartext">'+done+'/'+qs.length+'</div></div><div class="clear"></div>'}return h}
function render(){renderTabs();if(view==='home')home();if(view==='knowledge')knowledge();if(view==='quiz')quizHome();if(view==='essay')essays();if(view==='wrong')wrong();if(view==='progress')progress()}
function openReset(){$('resetModal').className='modal-bg'}function closeReset(){$('resetModal').className='modal-bg hide'}function doReset(){storageDel();state={answered:{},wrong:{},fav:{},read:{},essay:{},notes:{}};closeReset();render()}
window.compatGo=function(v){view=v;render()};$('resetTopBtn').onclick=openReset;$('cancelReset').onclick=closeReset;$('confirmReset').onclick=doReset;$('exportBtn').onclick=function(){var text=JSON.stringify(state,null,2);try{var blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='maogai-progress.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},500)}catch(e){alert(text)}};$('resetModal').onclick=function(e){if(e.target&&e.target.id==='resetModal')closeReset()};
var ua=navigator.userAgent||'';if(ua.indexOf('MicroMessenger')>=0||ua.indexOf('QQ/')>=0)$('wechatTip').className='tip';
render();
})();
</script>
