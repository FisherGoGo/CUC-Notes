<script>
const Q = [{"type": "choice", "points": 2, "question": "香农信息论中，一个事件的信息量主要取决于什么？", "options": ["事件发生概率的大小", "事件语义价值的高低", "事件文字描述的长度", "事件是否来自模拟信号"], "answer": 0, "explanation": "<strong>正确答案</strong>：事件发生概率的大小。<br><br><strong>解析</strong>：自信息 $I(x)=-\\log p(x)$，概率越小，发生后消除的不确定性越大。", "pitfall": "不要把语义重要性当成香农信息量。"}, {"type": "choice", "points": 2, "question": "信源编码器和信道编码器对冗余的基本态度分别是？", "options": ["信源编码去冗余，信道编码加冗余", "二者都尽量去冗余", "二者都尽量加冗余", "信源编码加冗余，信道编码去冗余"], "answer": 0, "explanation": "<strong>正确答案</strong>：信源编码去冗余，信道编码加冗余。<br><br><strong>解析</strong>：前者服务有效性，后者服务可靠性。", "pitfall": "两类冗余服务不同目标，不是互相矛盾。"}, {"type": "choice", "points": 2, "question": "若 $p(x)=1/8$，以 2 为底时 $I(x)$ 等于多少？", "options": ["3 bit", "1/8 bit", "8 bit", "$-3$ bit"], "answer": 0, "explanation": "<strong>正确答案</strong>：3 bit。<br><br><strong>解析</strong>：$I(x)=-\\log_2(1/8)=3$。", "pitfall": "自信息单位要跟对数底一致。"}, {"type": "choice", "points": 2, "question": "关于熵 $H(X)$，下列说法最准确的是？", "options": ["它是信源平均自信息", "它是某个具体符号的信息量", "它只由符号名称决定", "它一定等于信宿获得的信息量"], "answer": 0, "explanation": "<strong>正确答案</strong>：它是信源平均自信息。<br><br><strong>解析</strong>：$H(X)=E[I(x_i)]$，刻画整个概率分布的平均不确定性。", "pitfall": "具体符号用自信息，整个信源用熵。"}, {"type": "choice", "points": 2, "question": "二进制信源何时熵最大？", "options": ["两个符号等概率", "一个符号概率为 1", "两个符号概率都为 0", "概率越偏越大"], "answer": 0, "explanation": "<strong>正确答案</strong>：两个符号等概率。<br><br><strong>解析</strong>：熵函数上凸，分布越均匀不确定性越大，二进制时最大值为 1 bit/符号。", "pitfall": "确定输出时熵为 0，不是最大。"}, {"type": "choice", "points": 2, "question": "$H(XY)=H(X)+H(Y|X)$ 体现的是熵函数的哪种性质？", "options": ["强可加性", "确定性", "扩展性", "非负性"], "answer": 0, "explanation": "<strong>正确答案</strong>：强可加性。<br><br><strong>解析</strong>：联合熵可拆成先描述 $X$ 的不确定性，再描述已知 $X$ 后 $Y$ 的剩余不确定性。", "pitfall": "独立时才可进一步写成 $H(XY)=H(X)+H(Y)$。"}, {"type": "choice", "points": 2, "question": "离散无记忆信源的 $N$ 次扩展熵满足什么关系？", "options": ["$H(X^N)=NH(X)$", "$H(X^N)=H(X)/N$", "$H(X^N)=H(X)$", "$H(X^N)=\\log N$"], "answer": 0, "explanation": "<strong>正确答案</strong>：$H(X^N)=NH(X)$。<br><br><strong>解析</strong>：无记忆意味着各符号独立，序列总熵为各次熵之和。", "pitfall": "有记忆信源不能直接乘 $N$。"}, {"type": "choice", "points": 2, "question": "单符号离散信道矩阵中，每一行概率之和应为多少？", "options": ["1", "0", "输入符号数 $r$", "输出符号数 $s$"], "answer": 0, "explanation": "<strong>正确答案</strong>：1。<br><br><strong>解析</strong>：每行是在给定某个输入 $a_i$ 后所有可能输出的条件概率分布。", "pitfall": "通常行对应输入，列对应输出；不要检查成列和为 1。"}, {"type": "choice", "points": 2, "question": "信道疑义度通常指哪个量？", "options": ["$H(X|Y)$", "$H(Y|X)$", "$H(XY)$", "$H(X)-H(Y)$"], "answer": 0, "explanation": "<strong>正确答案</strong>：$H(X|Y)$。<br><br><strong>解析</strong>：收到输出 $Y$ 后，对输入 $X$ 仍存在的不确定性称为疑义度或损失熵。", "pitfall": "$H(Y|X)$ 是噪声熵。"}, {"type": "choice", "points": 2, "question": "信道容量 $C$ 的定义是？", "options": ["对输入分布取最大值的平均互信息", "任意输入分布下的熵 $H(X)$", "信道矩阵所有元素之和", "噪声熵 $H(Y|X)$"], "answer": 0, "explanation": "<strong>正确答案</strong>：对输入分布取最大值的平均互信息。<br><br><strong>解析</strong>：$C=\\max_{p(x)}I(X;Y)$，是信道属性。", "pitfall": "给定分布算出的 $I(X;Y)$ 不一定等于容量。"}, {"type": "tf", "points": 1, "question": "信息论中的信息量越大，表示消息的语义价值一定越高。", "options": [], "answer": false, "explanation": "<strong>正确答案</strong>：错误。<br><br><strong>解析</strong>：香农信息量只度量概率不确定性的减少，不度量语义价值。", "pitfall": "香农信息的适用范围是概率与通信极限。"}, {"type": "tf", "points": 1, "question": "无记忆信源一定满足符号序列概率可分解为各符号概率乘积。", "options": [], "answer": true, "explanation": "<strong>正确答案</strong>：正确。<br><br><strong>解析</strong>：这是无记忆信源的核心定义。", "pitfall": "平稳不等于无记忆。"}, {"type": "tf", "points": 1, "question": "自信息是对整个信源所有事件的信息量求平均。", "options": [], "answer": false, "explanation": "<strong>正确答案</strong>：错误。<br><br><strong>解析</strong>：自信息对应单个事件；熵才是平均自信息。", "pitfall": "看到「平均」优先想到熵。"}, {"type": "tf", "points": 1, "question": "若一个信源输出完全确定，则它的信息熵为 0。", "options": [], "answer": true, "explanation": "<strong>正确答案</strong>：正确。<br><br><strong>解析</strong>：$H(1,0,\\ldots,0)=0$。", "pitfall": "确定事件自信息也是 0。"}, {"type": "tf", "points": 1, "question": "$H(Y|X)$ 计算时需要按 $p(x_i)$ 对各条件熵加权。", "options": [], "answer": true, "explanation": "<strong>正确答案</strong>：正确。<br><br><strong>解析</strong>：$H(Y|X)=\\sum_i p(x_i)H(Y|x_i)$。", "pitfall": "不是简单算术平均。"}, {"type": "tf", "points": 1, "question": "齐次马尔可夫链一定是平稳随机过程。", "options": [], "answer": false, "explanation": "<strong>正确答案</strong>：错误。<br><br><strong>解析</strong>：齐次只说明转移概率与时间起点无关，不保证状态分布已平稳。", "pitfall": "平稳通常可推出齐次条件概率，但反过来不一定。"}, {"type": "tf", "points": 1, "question": "平均互信息满足 $I(X;Y)=I(Y;X)$。", "options": [], "answer": true, "explanation": "<strong>正确答案</strong>：正确。<br><br><strong>解析</strong>：互信息具有对称性。", "pitfall": "互信息对称不代表信道转移概率对称。"}, {"type": "tf", "points": 1, "question": "信道容量是信道本身的属性，与具体输入分布无关。", "options": [], "answer": true, "explanation": "<strong>正确答案</strong>：正确。<br><br><strong>解析</strong>：容量已经对输入分布取最大值。", "pitfall": "实际传输率 $I(X;Y)$ 仍依赖输入分布。"}, {"type": "tf", "points": 1, "question": "BSC 当交叉概率 $p=1/2$ 时容量为 1 bit/符号。", "options": [], "answer": false, "explanation": "<strong>正确答案</strong>：错误。<br><br><strong>解析</strong>：$C=1-H(p)$，$p=1/2$ 时 $H(p)=1$，容量为 0。", "pitfall": "$p=0$ 时才是无噪容量 1。"}, {"type": "tf", "points": 1, "question": "串联信道或数据处理通常不会增加关于原始输入的平均互信息。", "options": [], "answer": true, "explanation": "<strong>正确答案</strong>：正确。<br><br><strong>解析</strong>：这是信息不增原则或数据处理定理的直观含义。", "pitfall": "处理可以改变表示，但不能凭空增加关于原输入的信息。"}, {"type": "short", "points": 6, "question": "解释「自信息」和「信息熵」的区别，并写出对应公式。", "options": [], "answer": "自信息 $I(x_i)=-\\log p(x_i)$ 是单个事件发生前的不确定性或发生后提供的信息量；信息熵 $H(X)=-\\sum_i p(x_i)\\log p(x_i)$ 是整个信源的平均自信息，刻画平均不确定性。", "explanation": "<strong>参考答案</strong>：要点是「事件级」和「信源平均级」的区别，并写出两个公式。", "pitfall": "只写公式不解释层级，简答题容易丢分。"}, {"type": "short", "points": 6, "question": "为什么无记忆扩展信源满足 $H(X^N)=NH(X)$？", "options": [], "answer": "无记忆表示各次输出相互独立，序列概率可分解为单符号概率乘积。由联合熵链规则，独立时联合熵等于各随机变量熵之和；若每次同分布，则 $N$ 项都等于 $H(X)$，所以 $H(X^N)=NH(X)$。", "explanation": "<strong>参考答案</strong>：必须同时说出独立、链规则、同分布三个逻辑点。", "pitfall": "不能脱离无记忆条件直接套公式。"}, {"type": "short", "points": 6, "question": "区分信道疑义度 $H(X|Y)$ 和噪声熵 $H(Y|X)$。", "options": [], "answer": "$H(X|Y)$ 是收到输出 $Y$ 后，对输入 $X$ 仍然存在的平均不确定性，表示信道中损失的信息；$H(Y|X)$ 是已知输入 $X$ 后，输出 $Y$ 仍因噪声而存在的不确定性，表示噪声带来的随机性。", "explanation": "<strong>参考答案</strong>：接收端看输入是疑义度，发送端看输出是噪声熵。", "pitfall": "两个条件熵方向相反，名称不能互换。"}, {"type": "short", "points": 6, "question": "写出信道容量定义，并说明它为什么是信道属性。", "options": [], "answer": "$C=\\max_{p(x)}I(X;Y)$。对固定信道，平均互信息随输入概率分布变化；容量是在所有输入分布中取到的最大信息传输率，因此只由信道转移概率所决定，不依赖某一个实际信源分布。", "explanation": "<strong>参考答案</strong>：要写出最大化对象和「固定信道」这个前提。", "pitfall": "不要把 $I(X;Y)$ 和 $C$ 直接画等号。"}, {"type": "essay", "points": 8, "question": "从通信系统模型说明有效性和可靠性为什么会产生矛盾，以及信源编码、信道编码分别如何处理冗余。", "options": [], "answer": "通信系统中信源产生消息，编码器把消息变成适合信道传输的形式，信道中存在噪声。有效性要求单位资源传更多信息，因此希望去掉信源内部可预测、重复的冗余，信源编码负责压缩。可靠性要求在噪声下仍能恢复消息，因此需要加入校验或纠错冗余，信道编码负责抗干扰。二者看似一个去冗余一个加冗余，但处理的是不同层面的冗余：源冗余应压缩，抗噪冗余是可靠传输的代价。", "explanation": "<strong>参考答案</strong>：逻辑链应包含噪声、有效性、可靠性、信源编码、信道编码。", "pitfall": "不要简单说「编码器提高性能」，要说明两个编码器目标不同。"}, {"type": "essay", "points": 8, "question": "用熵、条件熵和联合熵解释链规则 $H(XY)=H(X)+H(Y|X)$ 的含义。", "options": [], "answer": "$H(XY)$ 是把 $X,Y$ 作为整体时的平均不确定性。若按顺序描述这个整体，可以先描述 $X$，平均需要 $H(X)$ 的信息量；在 $X$ 已知后，$Y$ 的剩余不确定性为 $H(Y|X)$。两部分相加就是完整描述联合变量所需的平均信息量。若 $X,Y$ 独立，则知道 $X$ 不减少 $Y$ 的不确定性，所以 $H(Y|X)=H(Y)$，链规则退化为 $H(XY)=H(X)+H(Y)$。", "explanation": "<strong>参考答案</strong>：重点是「先描述 X，再描述已知 X 后的 Y」。", "pitfall": "独立是特例，不是链规则成立的前提。"}, {"type": "essay", "points": 10, "question": "说明平均互信息、信道疑义度、噪声熵和信道容量之间的逻辑关系。", "options": [], "answer": "平均互信息 $I(X;Y)$ 衡量信道实际传过去的平均信息量。站在接收端，$I(X;Y)=H(X)-H(X|Y)$，其中 $H(X|Y)$ 是信道疑义度，表示收到输出后关于输入仍损失的信息；站在发送端，$I(X;Y)=H(Y)-H(Y|X)$，其中 $H(Y|X)$ 是噪声熵，表示已知输入后输出中由噪声造成的不确定性。对固定信道，改变输入分布会改变 $I(X;Y)$；把 $I(X;Y)$ 对所有输入分布取最大，就得到信道容量 $C=\\max_{p(x)}I(X;Y)$。所以互信息是实际传输率，容量是信道可达到的最大传输率。", "explanation": "<strong>参考答案</strong>：应把三个等价公式和最大化定义串起来。", "pitfall": "不要把疑义度和噪声熵混淆，也不要把互信息直接等同容量。"}, {"type": "comprehensive", "points": 20, "question": "某二元对称信道 BSC 的交叉概率为 $p$，输入等概。请回答：1. 写出信道矩阵；2. 写出平均互信息表达式；3. 求信道容量；4. 分析 $p=0$ 与 $p=1/2$ 两种极端情况；5. 说明为什么输入等概是达到容量的分布。", "options": [], "answer": "1. 信道矩阵为 $P=\\begin{bmatrix}1-p&p\\\\p&1-p\\end{bmatrix}$。2. 输入等概时输出也等概，$H(Y)=1$，噪声熵 $H(Y|X)=H(p)$，所以 $I(X;Y)=1-H(p)$。3. BSC 是强对称信道，等概输入达到容量，因此 $C=1-H(p)$。4. 当 $p=0$ 时无差错，$H(p)=0$，容量为 1 bit/符号；当 $p=1/2$ 时输出与输入独立，$H(p)=1$，容量为 0。5. 对称信道在输入等概时使输出等概，从而 $H(Y)$ 最大，同时每行噪声熵相同，所以平均互信息达到最大。", "explanation": "<strong>参考答案</strong>：综合题应覆盖矩阵、互信息、容量、极端情况和等概最优原因。", "pitfall": "常见错误是把 $p=1/2$ 当成「最随机所以容量最大」，实际此时输入信息全部被噪声淹没。"}];
const sections = {
  choice: '一、选择题',
  tf: '二、判断题',
  short: '三、简答题',
  essay: '四、问答题',
  comprehensive: '五、综合题'
};
const order = ['choice', 'tf', 'short', 'essay', 'comprehensive'];
function label(i) { return String.fromCharCode(65 + i); }
function refAnswer(q) {
  if (q.type === 'choice') return label(q.answer) + '. ' + q.options[q.answer];
  if (q.type === 'tf') return q.answer ? '正确' : '错误';
  return q.answer;
}
function render() {
  const root = document.getElementById('questions-container');
  let n = 1;
  for (const type of order) {
    const items = Q.filter(q => q.type === type);
    if (!items.length) continue;
    const h = document.createElement('h2');
    h.textContent = sections[type];
    root.appendChild(h);
    for (const q of items) {
      const idx = Q.indexOf(q);
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = 'q-' + idx;
      let inner = `<div class="q-meta">第 ${n++} 题 | ${q.points} 分</div><div><strong>${q.question}</strong></div>`;
      if (q.type === 'choice') {
        q.options.forEach((opt, oi) => {
          inner += `<label class="option" id="opt-${idx}-${oi}"><input type="radio" name="q${idx}" value="${oi}"> ${label(oi)}. ${opt}</label>`;
        });
      } else if (q.type === 'tf') {
        inner += `<label class="option" id="opt-${idx}-true"><input type="radio" name="q${idx}" value="true"> 正确</label>`;
        inner += `<label class="option" id="opt-${idx}-false"><input type="radio" name="q${idx}" value="false"> 错误</label>`;
      } else {
        inner += '<textarea placeholder="在此作答..."></textarea>';
      }
      inner += `<div class="answer-box" id="ans-${idx}"><div>${q.explanation}</div><div><strong>参考答案</strong>：${refAnswer(q)}</div><blockquote>易错提醒：${q.pitfall}</blockquote></div>`;
      card.innerHTML = inner;
      root.appendChild(card);
    }
  }
  if (window.MathJax) MathJax.typesetPromise();
}
function gradeAll() {
  let score = 0;
  Q.forEach((q, idx) => {
    const card = document.getElementById('q-' + idx);
    card.classList.remove('correct', 'wrong');
    const ans = document.getElementById('ans-' + idx);
    ans.style.display = 'block';
    if (q.type === 'choice' || q.type === 'tf') {
      const selected = document.querySelector(`input[name="q${idx}"]:checked`);
      const expected = String(q.answer);
      const correctId = q.type === 'choice' ? `opt-${idx}-${q.answer}` : `opt-${idx}-${expected}`;
      const correctEl = document.getElementById(correctId);
      if (correctEl) correctEl.classList.add('correct-answer');
      if (selected && selected.value === expected) {
        score += q.points;
        card.classList.add('correct');
      } else {
        card.classList.add('wrong');
        if (selected) {
          const wrongEl = document.getElementById(q.type === 'choice' ? `opt-${idx}-${selected.value}` : `opt-${idx}-${selected.value}`);
          if (wrongEl) wrongEl.classList.add('wrong-answer');
        }
      }
    }
  });
  document.getElementById('score-num').textContent = score;
  document.getElementById('score-box').style.display = 'block';
  if (window.MathJax) MathJax.typesetPromise();
}
render();
</script>
